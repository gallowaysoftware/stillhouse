name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  proto:
    name: proto / lint + codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Pinned to the versions in backend/go.mod, NOT @latest. The drift
      # check below compares regenerated output against what's committed,
      # and protoc-gen-go stamps its own version into every file it
      # writes — so an @latest install makes this job fail the moment a
      # new plugin release lands, on a one-line comment, with nothing
      # actually wrong. Bump these deliberately alongside go.mod.
      - name: Install Go protoc plugins
        run: |
          PROTOBUF_VERSION=$(cd backend && go list -m -f '{{.Version}}' google.golang.org/protobuf)
          CONNECT_VERSION=$(cd backend && go list -m -f '{{.Version}}' connectrpc.com/connect)
          echo "protoc-gen-go       $PROTOBUF_VERSION"
          echo "protoc-gen-connect-go $CONNECT_VERSION"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$PROTOBUF_VERSION"
          go install "connectrpc.com/connect/cmd/protoc-gen-connect-go@$CONNECT_VERSION"
      - name: Install web deps (for protoc-gen-es)
        run: cd web && npm ci
      - name: Lint .proto
        run: cd proto && buf lint
      - name: Regenerate Go code
        run: cd proto && buf generate --template buf.gen.yaml
      - name: Regenerate TS code
        run: cd proto && buf generate --template buf.gen.web.yaml
      - name: Fail if generated code drifted
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generated code is out of date — run 'make generate' and commit the result"
            echo "If the only difference is a plugin version comment, the pinned"
            echo "versions above have drifted from your local toolchain instead."
            git --no-pager diff
            exit 1
          fi

  lint:
    name: go / lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # gofmt covers both modules. qa/ can't be built here — it `replace`s
      # a sibling vibe checkout that doesn't exist in CI — but formatting
      # is purely syntactic, so it's still checked.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l backend qa)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean — run 'make fmt'"
            echo "$unformatted"
            gofmt -d backend qa
            exit 1
          fi
      - name: golangci-lint (backend)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

  vulncheck:
    name: go / vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Read the toolchain from go.mod so a stdlib advisory is fixed by
          # bumping one line, and the version CI scans is the version the
          # Dockerfile builds.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

  backend:
    name: backend / build + vet + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: cd backend && go vet ./...
      - name: go test (unit)
        run: cd backend && go test ./...
      - name: go build
        run: cd backend && go build ./...

  backend-integration:
    name: backend / integration (RLS isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stillhouse
          POSTGRES_USER: stillhouse
          POSTGRES_PASSWORD: stillhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stillhouse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - name: Apply migrations (creates stillhouse_app role too)
        env:
          PG_DSN: postgres://stillhouse:stillhouse@localhost:5432/stillhouse?sslmode=disable
        run: migrate -path backend/internal/db/migrations -database "$PG_DSN" up
      - name: Run integration tests
        env:
          STILLHOUSE_INTEGRATION_TEST_ADMIN_DSN: postgres://stillhouse:stillhouse@localhost:5432/stillhouse?sslmode=disable
          STILLHOUSE_INTEGRATION_TEST_DSN: postgres://stillhouse_app:stillhouse_app@localhost:5432/stillhouse?sslmode=disable
        run: |
          cd backend
          go test -v -run TestRLSIsolation ./internal/tenantdb/
          go test -v -run TestB266GenerationEndToEnd ./internal/rpc/

  web:
    name: web / typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run build
