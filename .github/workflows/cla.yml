name: cla

# Stillhouse may be offered under a commercial licence alongside the
# AGPL, and that is only possible while the maintainer holds sufficient
# rights in all of the code. This checks each contributor has signed
# CLA.md once. See CONTRIBUTING.md for the reasoning.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

# pull_request_target runs against the BASE repo, so it has write access
# and secrets even for a fork's pull request. That is what lets the bot
# record a signature — and it is why this workflow must never check out
# or execute the pull request's code. It doesn't: the only action below
# reads metadata and writes a signature file.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: check signature
    runs-on: ubuntu-latest
    # Run on pull request events, and on the one comment that signs.
    if: >-
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/gallowaysoftware/stillhouse/blob/main/CLA.md
          # Signatures live on their own branch so main stays free of bot
          # commits.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          allowlist: pequalsnp,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request.

            Stillhouse is AGPL-3.0 and always will be. It may also be offered under a
            separate commercial licence, which is only possible while one party holds
            sufficient rights in all of the code — so contributions need a one-time
            signature on the [CLA](https://github.com/gallowaysoftware/stillhouse/blob/main/CLA.md).
            It does not take your copyright away; you keep it.

            If you would rather not sign, that is completely reasonable — say so and
            we will find another way.

            To sign, reply to this thread with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks.
