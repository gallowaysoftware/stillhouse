# Production stack — bundles Postgres and the Stillhouse app.
#
# Networking:
#   - `stillhouse` bridge: internal, db + app talk over it. Postgres has no
#     LAN exposure at all.
#   - `macvlan` (external): the app gets its own LAN IP so it appears as a
#     real host on the network. Put a reverse proxy in front of it for TLS.
#
# The macvlan is optional. If you'd rather publish a port the ordinary way,
# delete the `macvlan` network and the app's `networks:` block, and add:
#     ports: ["8080:8080"]
#
# Prereqs:
#   - COMPOSE_NETWORK_EXTERNAL names an existing external network (on
#     Unraid this is typically `br0`; Settings → Docker → enable
#     macvlan/ipvlan).
#   - STILLHOUSE_IMAGE points at a registry you can pull from. Build and
#     push one with `make image-push`.
#   - The Canadian Alcoholometric Tables, downloaded from CRA into
#     $STILLHOUSE_DATA_DIR/alcoholometric-tables/. Optional, but without
#     them the app can't correct readings to 20 °C. See deploy/README.md.
#
# .env (sibling of this file in the stack folder) — see .env.example.

services:

  postgres:
    image: docker.io/library/postgres:16
    container_name: stillhouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stillhouse
      POSTGRES_USER: stillhouse
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?PG_ADMIN_PASSWORD must be set in .env}
    volumes:
      - ${STILLHOUSE_DATA_DIR:?STILLHOUSE_DATA_DIR must be set in .env}/postgres:/var/lib/postgresql/data
    networks: [stillhouse]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stillhouse -d stillhouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${STILLHOUSE_IMAGE:?STILLHOUSE_IMAGE must be set in .env}
    container_name: stillhouse-app
    restart: unless-stopped
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Superuser DSN — used at boot for migrations + app-role password rotate.
      ADMIN_DATABASE_URL: postgres://stillhouse:${PG_ADMIN_PASSWORD}@postgres:5432/stillhouse?sslmode=disable
      # App-role DSN — what the running server connects with so RLS enforces.
      DATABASE_URL: postgres://stillhouse_app:${PG_APP_PASSWORD:?PG_APP_PASSWORD must be set in .env}@postgres:5432/stillhouse?sslmode=disable
      # Rotates stillhouse_app's password from the migration default before
      # the server switches over to DATABASE_URL.
      STILLHOUSE_APP_PASSWORD: ${PG_APP_PASSWORD}
      STILLHOUSE_ADDR: ":8080"
      STILLHOUSE_STATIC_DIR: /app/static
      # Where the Canadian Alcoholometric Tables are mounted. Optional —
      # without them the app runs but can't correct readings to 20 °C.
      STILLHOUSE_ALCOHOLOMETRIC_TABLES: /data/alcoholometric-tables
    volumes:
      # The operator's own copy of the tables, downloaded from CRA (see
      # deploy/README.md). Read-only; the app only ever reads it.
      - ${STILLHOUSE_DATA_DIR}/alcoholometric-tables:/data/alcoholometric-tables:ro
    networks:
      macvlan:
        ipv4_address: ${WEB_IPV4:?WEB_IPV4 must be set in .env}
      stillhouse: {}
    labels:
      net.unraid.docker.webui: "http://${WEB_IPV4}:8080"
      net.unraid.docker.shell: "sh"
    # No app healthcheck — the distroless runtime has no wget/curl to probe
    # /healthz from inside the container. Use your reverse proxy's upstream
    # check as the operational signal.

networks:
  stillhouse:
    driver: bridge
    name: stillhouse
  macvlan:
    external: true
    name: ${COMPOSE_NETWORK_EXTERNAL:?COMPOSE_NETWORK_EXTERNAL must be set in .env}
