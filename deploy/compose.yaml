# Dev environment. The Stillhouse server itself runs on the host (so iterative
# development is fast); only Postgres lives in a container.
services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: stillhouse-postgres
    environment:
      POSTGRES_DB: stillhouse
      POSTGRES_USER: stillhouse
      POSTGRES_PASSWORD: stillhouse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stillhouse -d stillhouse"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
