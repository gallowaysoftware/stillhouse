// AuditEvent: append-only record of significant actions taken in the system.
// Backs s.206 (Excise Act, 2001) daily records expectations: every meaningful
// change is captured with actor, timestamp, and payload.
syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_CREATE = 1;
  AUDIT_ACTION_UPDATE = 2;
  AUDIT_ACTION_DELETE = 3;
  AUDIT_ACTION_SIGN = 4;
  AUDIT_ACTION_LOGIN = 5;
  AUDIT_ACTION_LOGOUT = 6;
}

message AuditEvent {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;              // empty when system-generated
  string user_email = 4;
  string user_display_name = 5;
  string entity_type = 6;
  string entity_id = 7;
  AuditAction action = 8;
  google.protobuf.Timestamp occurred_at = 9;
  bytes payload_json = 10;
}

message ListAuditEventsRequest {
  string entity_type = 1;          // optional filter
  int32  limit = 2;                // default 100, max 1000
  int32  offset = 3;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  int64 total_count = 2;
}

service AuditService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}
