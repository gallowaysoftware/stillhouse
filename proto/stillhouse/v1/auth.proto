syntax = "proto3";

package stillhouse.v1;

import "stillhouse/v1/tenant.proto";
import "stillhouse/v1/user.proto";

message ListMyDistilleriesRequest {}
message ListMyDistilleriesResponse {
  // Includes the one currently signed in to, flagged, so the switcher can
  // show where you are as well as where you could go.
  repeated MyDistillery distilleries = 1;
}
message MyDistillery {
  string tenant_id = 1;
  string tenant_name = 2;
  bool   current = 3;
  // The role held at THAT distillery, which need not be the role held
  // here. Shown so a switch does not silently change what you can do.
  string role = 4;
}

// Switching is a re-authentication, not a context change, and the reason
// is in Login: an email address can hold accounts at several distilleries
// and "one password may be right at one distillery and wrong at another".
// A session at one therefore proves nothing about the others, so the
// credentials are verified against the target account exactly as a fresh
// login would. What is saved is signing out, not proving who you are.
//
// The second factor follows the same rule. If the target account has one
// enrolled it is required, whether or not the current session needed one
// — otherwise switching would be a way to reach an MFA-protected account
// without satisfying its MFA.
message SwitchDistilleryRequest {
  string tenant_id = 1;
  string password = 2;
  string totp_code = 3;
  string recovery_code = 4;
}
message SwitchDistilleryResponse {
  User user = 1;
  Tenant tenant = 2;
  // Set when the target account has a second factor and no code was
  // given. No switch has happened; the client asks for a code and comes
  // back. Mirrors LoginResponse.mfa_required.
  bool mfa_required = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  // Six-digit code from the authenticator app, when the account has a
  // second factor. Empty on the first attempt; the server answers with
  // mfa_required and the client comes back with one.
  string totp_code = 4;
  // A recovery code, used instead of totp_code when the phone is gone.
  // Single use.
  string recovery_code = 5;
  // Which distillery to sign in to, when one email address holds an
  // account at more than one. Empty on the first attempt; the server
  // answers with `choices` and the client comes back with one of them.
  string tenant_id = 3;
}

// A distillery the credentials just presented are good for. Only ever
// returned after the password has been verified against that account, so
// listing it tells the caller nothing they did not already prove.
message TenantChoice {
  string tenant_id = 1;
  string tenant_name = 2;
}

message LoginResponse {
  User user = 1;
  Tenant tenant = 2;
  // True when the password was right and a second factor is still
  // needed. `user` and `tenant` are unset and no session is created.
  bool mfa_required = 4;
  // Populated only when the credentials match accounts at more than one
  // distillery and the request named none. `user` and `tenant` are unset
  // in that case and no session is created — the caller picks one and
  // logs in again with tenant_id set.
  repeated TenantChoice choices = 3;
}

message LogoutRequest {}
message LogoutResponse {}

// Public — always returns success. Backend silently skips if the email
// isn't on file so we don't leak which addresses are registered.
message RequestPasswordResetRequest { string email = 1; }
message RequestPasswordResetResponse {}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}
message ResetPasswordResponse {}

// ----- second factor -------------------------------------------------------

// Enrolment is two steps on purpose. BeginMFAEnrolment hands back a
// secret; nothing is enforced until ConfirmMFAEnrolment proves the app
// actually produces matching codes. Enrolling in one step means a
// mistyped secret locks the account at the next sign-in.
message BeginMFAEnrolmentRequest {}
message BeginMFAEnrolmentResponse {
  // The otpauth:// URI. On a phone, tapping it opens the authenticator
  // app directly.
  string enrolment_uri = 1;
  // The same secret in base32, grouped in fours, for typing in by hand.
  string secret = 2;
}

message ConfirmMFAEnrolmentRequest { string code = 1; }
message ConfirmMFAEnrolmentResponse {
  // Shown once. The phone is the single point of failure in any TOTP
  // setup and these are the way back from a lost one.
  repeated string recovery_codes = 1;
}

// Disabling requires the current password: a second factor that an
// already-hijacked session can switch off has not added a factor.
message DisableMFARequest { string current_password = 1; }
message DisableMFAResponse {}

message MFAStatusRequest {}
message MFAStatusResponse {
  bool enabled = 1;
  // Enrolment started and never confirmed. Not enforced at login.
  bool pending = 2;
  int32 recovery_codes_remaining = 3;
  // False when the install has no STILLHOUSE_SECRET_KEY, so secrets
  // cannot be encrypted at rest and enrolment refuses rather than
  // storing one in the clear.
  bool available = 4;
  string unavailable_reason = 5;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // The distilleries this email holds an account at, for the switcher.
  rpc ListMyDistilleries(ListMyDistilleriesRequest) returns (ListMyDistilleriesResponse);
  // Move an existing session to another of them. Credentials are checked
  // against the target account — see the message comment.
  rpc SwitchDistillery(SwitchDistilleryRequest) returns (SwitchDistilleryResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc MFAStatus(MFAStatusRequest) returns (MFAStatusResponse);
  rpc BeginMFAEnrolment(BeginMFAEnrolmentRequest) returns (BeginMFAEnrolmentResponse);
  rpc ConfirmMFAEnrolment(ConfirmMFAEnrolmentRequest) returns (ConfirmMFAEnrolmentResponse);
  rpc DisableMFA(DisableMFARequest) returns (DisableMFAResponse);
}
