// CRA Form B266 (Excise Duty Return — Spirits Licensee). The values in
// B266Report are what you transcribe into the My Business Account / Web
// Form Filer return for the period.
syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";
import "stillhouse/v1/tenant.proto";

enum B266Status {
  B266_STATUS_UNSPECIFIED = 0;
  B266_STATUS_DRAFT = 1;
  B266_STATUS_SUBMITTED = 2;
}

message SuggestB266PeriodRequest {
  // Suggest the period containing this date; empty means today. A licensee
  // filing last month's return in the first week of this one gets last
  // month, which is the ordinary case, by passing the period end.
  string on = 1;
}
message SuggestB266PeriodResponse {
  string period_start = 1;
  string period_end = 2;
  string due_on = 3;
  int32  days_until_due = 4;
  // The period before the suggested one, so an operator catching up has
  // somewhere to go without doing the arithmetic.
  string previous_period_start = 5;
  string previous_period_end = 6;
}

message B266Period {
  string id = 1;
  string period_start = 2;       // ISO date
  string period_end = 3;
  B266Status status = 4;
  google.protobuf.Timestamp submitted_at = 5;
  string submitted_by = 6;
  string notes = 7;
  google.protobuf.Timestamp created_at = 8;
  // Who confirmed they had checked the figures, when, and against what
  // wording. Read years later, so the text is stored rather than a flag.
  google.protobuf.Timestamp filing_acknowledged_at = 11;
  string filing_acknowledged_by = 12;
  string filing_acknowledged_by_name = 13;
  string filing_acknowledgement = 14;
  google.protobuf.Timestamp updated_at = 9;
  // Frozen at generation, so a later change of fiscal-month election does
  // not silently restate when a past return was due.
  string due_on = 10;
}

// B266Report mirrors the lines you'd enter on the CRA form. All amounts
// in LAA (litres absolute alcohol) unless otherwise noted; duty in CAD.
message B266Report {
  string period_start = 1;
  string period_end = 2;

  // Bulk spirits section (Form lines 1-9 roughly).
  double bulk_opening_laa = 10;
  double bulk_production_laa = 11;        // production_gauge movements
  double bulk_received_in_bond_laa = 12;
  double bulk_blend_in_laa = 13;
  double bulk_transferred_to_packaging_laa = 14;
  double bulk_transferred_out_in_bond_laa = 15;
  double bulk_losses_laa = 16;            // evaporation + unaccounted
  double bulk_destroyed_laa = 17;
  double bulk_closing_laa = 18;
  // Stock adopted into Stillhouse during this period — alcohol that was
  // already in the warehouse before the distillery started using the
  // system. It is NOT production, and is already inside bulk_opening_laa;
  // it is reported separately so an adopted balance is never invisible on
  // the return it affects.
  double bulk_opening_inventory_adopted_laa = 19;
  // What the closing balance is made of, once ownership and possession
  // stop agreeing. Neither is a line on the form — EDM10-1-7 page 3 asks
  // for everything in your possession and nothing else — but a licensee
  // signing a return that includes a customer's casks should be able to
  // see that it does, and one whose own casks are at a partner's
  // warehouse should be able to see why they are absent.
  //
  // held_for_others is inside bulk_closing_laa. held_elsewhere is not.
  double bulk_closing_held_for_others_laa = 75;
  double bulk_held_elsewhere_laa = 76;
  // Somebody else's, somewhere else — on neither this return nor your
  // books. Small, and reported because the other two figures cannot
  // account for it and a licensee reconciling them should not have to
  // wonder where the difference went.
  double bulk_third_party_elsewhere_laa = 77;
  // Line D — reason-coded adjustments reconciling book inventory to
  // physical. Signed net, with each direction also reported: a period that
  // found 3 LAA in one tank and lost 3 in another nets to zero, and a line
  // showing only the net would say nothing happened.
  double bulk_adjustments_laa = 20;
  double bulk_adjustments_increase_laa = 21;
  double bulk_adjustments_decrease_laa = 22;
  int32  bulk_adjustments_count = 23;

  // The rest of EDM10-1-7 page 3. Receipts first, then dispositions.
  double bulk_imported_laa = 24;
  double bulk_received_from_licensee_laa = 25;
  double bulk_received_from_licensed_user_laa = 26;
  double bulk_packaged_returned_to_bulk_laa = 27;
  double bulk_delivered_to_licensee_laa = 28;
  double bulk_delivered_to_licensed_user_laa = 29;
  double bulk_exported_laa = 64;
  double bulk_denatured_da_laa = 65;
  double bulk_denatured_sda_laa = 66;
  double bulk_returned_to_production_laa = 67;

  // Losses split by duty treatment. bulk_losses_laa stays as the total, so
  // the three below always sum to it.
  //
  // Unclassified is reported rather than assumed either way: Stillhouse
  // does not know whether a given evaporation loss is relieved, and putting
  // a number on a return that nobody chose is the thing this product does
  // not do. A period with unclassified losses is not ready to file, and
  // filing_blockers says so.
  double bulk_losses_relieved_laa = 68;
  double bulk_losses_dutiable_laa = 69;
  double bulk_losses_unclassified_laa = 70;
  // Duty on the dutiable losses, at the rate in force over the period.
  // Included in duty_payable_cad.
  double duty_on_losses_cad = 71;

  // Reasons this period cannot be filed as it stands, in the operator's
  // words. Empty means nothing is outstanding — which is not a promise the
  // figures are right, only that nothing is missing.
  repeated string filing_blockers = 72;

  // When this return falls due: the last day of the fiscal month following
  // the reporting period (EDM3-1-1 ¶50). Empty if the period's dates put
  // the due date outside what the fiscal calendar can compute.
  string due_on = 73;
  // Negative once the due date has passed.
  int32 days_until_due = 74;

  // Packaged spirits section.
  double packaged_opening_laa = 30;
  double packaged_packaged_laa = 31;      // produced by bottling runs
  int32  packaged_packaged_bottles = 32;
  double packaged_removed_duty_paid_laa = 33;
  int32  packaged_removed_duty_paid_bottles = 34;
  double packaged_closing_laa = 35;
  int32  packaged_closing_bottles = 36;
  // Alcohol that left bulk for the bottling line but never became a sealed
  // bottle — spillage, what stays in the filler. packaged_packaged_laa
  // counts bottles only, so without this line the packaged section doesn't
  // reconcile with bulk_transferred_to_packaging_laa and the reverse-walked
  // opening balance goes negative.
  double packaged_packaging_loss_laa = 37;
  // Duty splits by strength band and the two bands are charged in
  // different units, so each is reported with the quantity it is actually
  // charged on. duty_payable_cad is their sum.
  double packaged_removed_over7_laa = 38;         // charged per LAA
  double packaged_removed_over7_duty_cad = 39;
  int32  packaged_removed_over7_bottles = 40;
  double packaged_removed_under7_litres = 41;     // charged per litre of product
  double packaged_removed_under7_duty_cad = 42;
  int32  packaged_removed_under7_bottles = 43;
  double duty_rate_per_litre_under7 = 44;

  // Packaging, split by duty treatment. Which side a run lands on follows
  // from the tenant's duty point: an at-packaging licensee cannot hold
  // non-duty-paid packaged spirits at all, so everything it bottles is
  // duty-paid the moment it is packaged.
  double packaged_duty_paid_laa = 45;
  int32  packaged_duty_paid_bottles = 46;
  double packaged_non_duty_paid_laa = 47;
  int32  packaged_non_duty_paid_bottles = 48;
  // The third column of that line: packaged into marked special
  // containers rather than into bottles. Empty until stage 182 there was
  // nothing that could write it. Containers unmarked under s.156 are
  // excluded — their contents went back to bulk, and a return that says
  // they were packaged and nothing about their coming back is wrong in
  // the direction that over-reports.
  double packaged_marked_containers_laa = 78;
  double packaged_marked_containers_litres = 79;
  int32  packaged_marked_containers_count = 80;

  // And what left in them. Reported on its own rather than folded into
  // the bottle removals: a marked container is one object with a volume,
  // not a bottle count, and the two are charged on lines that ask
  // different questions.
  double delivered_marked_containers_laa = 81;
  double delivered_marked_containers_litres = 82;
  int32  delivered_marked_containers_count = 83;
  double delivered_marked_containers_duty_cad = 84;

  // Duty crystallised at packaging in this period, by strength band —
  // the mirror of the removal split above, charged on the same two units.
  double packaged_dutied_over7_laa = 52;        // charged per LAA
  double packaged_dutied_over7_duty_cad = 53;
  double packaged_dutied_under7_litres = 54;    // charged per litre of product
  double packaged_dutied_under7_duty_cad = 55;

  // Duty section.
  double duty_rate_per_laa = 50;          // rate in force over the period (CAD/LAA) >7%
  // Total duty payable for the period: duty crystallised at packaging plus
  // duty crystallised at removal. For any one tenant in any one period
  // both are populated only across a duty-point cutover, when stock
  // packaged before the change is still dutied on its way out.
  double duty_payable_cad = 51;

  // Which basis this return was computed on, and the cutover date it
  // applies from. On the return itself because the figures cannot be
  // checked without knowing which event they were crystallised at.
  DutyPoint duty_point = 56;
  string duty_point_effective_from = 57;

  google.protobuf.Timestamp generated_at = 60;
}

message GenerateB266Request {
  string period_start = 1;       // ISO date; required
  string period_end = 2;         // ISO date; required (inclusive)
}
message GenerateB266Response {
  B266Period period = 1;
  B266Report report = 2;
}

// The statements a person confirms before a period is marked submitted.
//
// Served by the server rather than written into the client, so the wording
// recorded against a period is the wording that was shown, and both come
// from one place. The client sends back the text it displayed, and the
// server refuses if it does not match — a confirmation to text the person
// never saw is not a confirmation.
message FilingAcknowledgementRequest {}
message FilingAcknowledgementResponse {
  // Each statement the person is confirming, shown as its own line.
  repeated string statements = 1;
  // The exact text recorded against the period, frozen with it.
  string acknowledgement_text = 2;
}

message SubmitB266Request {
  string period_id = 1;
  // The acknowledgement text as displayed. Must match what
  // GetFilingAcknowledgement returns; a period cannot be submitted
  // without it.
  string acknowledgement = 2;
}
message SubmitB266Response {
  B266Period period = 1;
  B266Report snapshot = 2;
}

message ListB266PeriodsRequest {}
message ListB266PeriodsResponse { repeated B266Period periods = 1; }

message GetB266PeriodRequest { string id = 1; }
message GetB266PeriodResponse {
  B266Period period = 1;
  // Frozen snapshot from submit time. Unset when status == DRAFT (which
  // means values were never frozen — re-run GenerateB266 to compute fresh).
  B266Report snapshot = 2;
}

// Reopen flips a submitted period back to draft. Owner-only — needed
// when a genuine correction has to be made to a filed month and the
// operator wants the period-lock guard (stage 66) to stop blocking
// backdated mutations. Snapshot stays for audit.
message ReopenB266PeriodRequest {
  string id = 1;
  string reason = 2;
}
message ReopenB266PeriodResponse { B266Period period = 1; }

service B266Service {
  // The statements shown before a period is marked submitted.
  rpc GetFilingAcknowledgement(FilingAcknowledgementRequest) returns (FilingAcknowledgementResponse);
  // The period the licensee should be filing, on their own fiscal calendar.
  rpc SuggestB266Period(SuggestB266PeriodRequest) returns (SuggestB266PeriodResponse);
  rpc GenerateB266(GenerateB266Request) returns (GenerateB266Response);
  rpc SubmitB266(SubmitB266Request) returns (SubmitB266Response);
  rpc ListB266Periods(ListB266PeriodsRequest) returns (ListB266PeriodsResponse);
  rpc GetB266Period(GetB266PeriodRequest) returns (GetB266PeriodResponse);
  rpc ReopenB266Period(ReopenB266PeriodRequest) returns (ReopenB266PeriodResponse);
}
