// Barrels are a kind of bulk_container with cooperage attributes and a
// maturation clock. Fill / dump events flow through the bulk_movements
// ledger so the alcohol ledger stays unified.
syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";
import "stillhouse/v1/instrument.proto";
import "stillhouse/v1/alcoholometry.proto";

enum BarrelEventKind {
  BARREL_EVENT_KIND_UNSPECIFIED = 0;
  BARREL_EVENT_KIND_FILL = 1;
  BARREL_EVENT_KIND_REGAUGE = 2;
  BARREL_EVENT_KIND_SAMPLE = 3;
  BARREL_EVENT_KIND_DUMP = 4;
  BARREL_EVENT_KIND_MOVE = 5;
  BARREL_EVENT_KIND_DESTROY = 6;
}

// Barrel is the joined view of a bulk_container (kind=barrel) + barrel_attributes
// + derived maturation info.
message Barrel {
  string id = 1;
  string name = 2;                    // human-friendly label, often the burnin serial
  double capacity_l = 3;
  bool   capacity_l_set = 4;
  string location = 5;
  string notes = 6;
  bool   archived = 7;

  // Running balance.
  double current_volume_l = 8;
  double current_abv_pct = 9;
  bool   current_abv_pct_set = 10;
  double current_laa = 11;

  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;

  // Cooperage attributes.
  string cooperage_supplier = 20;
  int32  char_level = 21;
  bool   char_level_set = 22;
  string wood_species = 23;
  string prior_use = 24;               // e.g., 'new', 'ex-bourbon', 'ex-wine'
  string serial_burnin = 25;
  string rickhouse = 26;
  string row_position = 27;
  string level_position = 28;
  string column_position = 29;

  // Maturation. fill_date is empty for empty barrels; days_aged is 0 then.
  string fill_date = 40;               // ISO date (YYYY-MM-DD), empty if empty/dumped
  int32  days_aged = 41;
  int32  days_aged_at_dump = 42;
  bool   days_aged_at_dump_set = 43;
  // Canadian Whisky eligibility per FDR B.02.020: ≥3 years (1095 days)
  // aging in small wood (≤700 L). small_wood_eligible considers the capacity.
  bool   small_wood = 50;
  bool   canadian_whisky_eligible = 51;
  int32  days_to_canadian_whisky_eligible = 52;

  // Angel's share assessment against the fill this cask is living off.
  // Populated on list and detail reads alike, so a dashboard can flag a
  // leaking cask without opening every barrel page.
  MaturationAssessment maturation = 53;
}

// How serious a maturation finding is. Advisory — nothing here blocks a
// write.
enum MaturationFindingSeverity {
  MATURATION_FINDING_SEVERITY_UNSPECIFIED = 0;
  MATURATION_FINDING_SEVERITY_INFO = 1;
  MATURATION_FINDING_SEVERITY_WARNING = 2;
  MATURATION_FINDING_SEVERITY_PROBLEM = 3;
}

message MaturationFinding {
  MaturationFindingSeverity severity = 1;
  string code = 2;
  string title = 3;
  string detail = 4;
}

// MaturationAssessment answers the question a warehouse actually raises:
// is this cask losing what it should be losing?
//
// Rates are compounded annual figures — losses compound on a shrinking
// volume, so a geometric rate is the honest one across multiple years.
// Expected bands are from the IBD/CIBD curriculum: 2–3 % a year in a
// cool, humid warehouse with the strength falling about a point a year;
// 4–5 % and rising strength in a hot, dry one.
message MaturationAssessment {
  // False when there isn't enough history to say anything — everything
  // below is meaningless then, and why_not explains the refusal.
  bool   measurable = 1;
  string why_not = 2;

  double annual_volume_loss_pct = 3;
  // The figure that costs money: duty is charged on LAA.
  double annual_laa_loss_pct = 4;
  // Percentage points of strength per year, signed.
  double strength_drift_per_year = 5;

  double expected_min_pct = 6;
  double expected_max_pct = 7;
  // Which way the strength should be moving: negative loses strength.
  double expected_drift_sign = 8;
  // True when the shelf height was legible and refined the expectation —
  // a cask high in the stack runs hot and dry even in a cool building.
  bool   climate_from_level = 9;
  bool   hot_dry = 10;

  repeated MaturationFinding findings = 11;
}

message BarrelEvent {
  string id = 1;
  string container_id = 2;
  BarrelEventKind kind = 3;
  google.protobuf.Timestamp event_date = 4;
  // volume_l / abv_pct / laa are the values AT 20 °C. A warehouse is the
  // place a reading is least likely to be taken at 20 °C, so observed_*
  // below keep what the operator actually saw.
  double volume_l = 5;
  bool   volume_l_set = 6;
  double abv_pct = 7;
  bool   abv_pct_set = 8;
  double laa = 9;
  bool   laa_set = 10;
  string bulk_movement_id = 11;        // empty for sample/move
  string location_after = 12;
  string notes = 13;
  string user_id = 14;
  google.protobuf.Timestamp created_at = 15;

  double temperature_c = 16;
  bool   temperature_c_set = 17;
  double observed_volume_l = 18;
  double observed_density_kg_m3 = 19;
  bool   observed_density_kg_m3_set = 20;
  double volume_factor_c = 21;
  StrengthSource strength_source = 22;

  // The instruments the determination was made with, resolved. This is the
  // last link in the audit chain: quantity → movement → determination →
  // the approved instrument that made it (EDM3-1-1 ¶24, EDM1-1-5). Unset
  // on rows recorded before the register existed, which is honest — they
  // name no instrument because none was named.
  DeterminationInstruments instruments = 23;
}

// --- requests ---

message CreateBarrelRequest {
  string name = 1;
  double capacity_l = 2;
  bool   capacity_l_set = 3;
  string cooperage_supplier = 4;
  int32  char_level = 5;
  bool   char_level_set = 6;
  string wood_species = 7;
  string prior_use = 8;
  string serial_burnin = 9;
  string rickhouse = 10;
  string row_position = 11;
  string level_position = 12;
  string column_position = 13;
  string location = 14;
  string notes = 15;
}
message CreateBarrelResponse { Barrel barrel = 1; }

message ListBarrelsRequest { bool include_archived = 1; }
message ListBarrelsResponse {
  repeated Barrel barrels = 1;
  int32 total_count = 2;
  int32 aging_count = 3;
  int32 eligible_count = 4;
  double total_laa = 5;
}

message GetBarrelRequest { string id = 1; }
message GetBarrelResponse {
  Barrel barrel = 1;
  repeated BarrelEvent events = 2;
  // Populated when the cask has a fill to measure against.
  MaturationAssessment maturation = 3;
}

message FillBarrelRequest {
  string barrel_id = 1;
  string source_container_id = 2;
  double volume_l = 3;
  double abv_pct = 4;
  google.protobuf.Timestamp event_date = 5;
  string notes = 6;
  double temperature_c = 7;
  bool   temperature_c_set = 8;
  double density_kg_m3 = 9;
  bool   density_kg_m3_set = 10;
  // The instruments this determination was made with. Optional — the
  // register starts empty — but any instrument named here is checked, and
  // one without a CRA approval on file is refused.
  InstrumentRefs instruments = 11;
}
message FillBarrelResponse {
  BarrelEvent event = 1;
  Barrel barrel = 2;
  // Conditions that did not block the determination but that an operator
  // and an auditor both want to see — an instrument past due for
  // calibration is still approved, so it is a warning, not a refusal.
  repeated string warnings = 3;
}

message DumpBarrelRequest {
  string barrel_id = 1;
  string destination_container_id = 2;
  double volume_l = 3;                 // actual measured at dump
  double abv_pct = 4;                  // actual at dump
  google.protobuf.Timestamp event_date = 5;
  string notes = 6;
  double temperature_c = 7;
  bool   temperature_c_set = 8;
  double density_kg_m3 = 9;
  bool   density_kg_m3_set = 10;
  // The instruments this determination was made with. Optional — the
  // register starts empty — but any instrument named here is checked, and
  // one without a CRA approval on file is refused.
  InstrumentRefs instruments = 11;
}
message DumpBarrelResponse {
  BarrelEvent event = 1;
  Barrel barrel = 2;
  // Conditions that did not block the determination but that an operator
  // and an auditor both want to see — an instrument past due for
  // calibration is still approved, so it is a warning, not a refusal.
  repeated string warnings = 3;
}

message RegaugeBarrelRequest {
  string barrel_id = 1;
  // new_volume_l is the volume as gauged, at temperature_c.
  double new_volume_l = 2;
  // Strength at 20 °C, or leave unset and send density_kg_m3 to have the
  // published tables resolve it.
  double new_abv_pct = 3;
  google.protobuf.Timestamp event_date = 4;
  string notes = 5;
  double temperature_c = 6;
  bool   temperature_c_set = 7;
  double density_kg_m3 = 8;
  bool   density_kg_m3_set = 9;
  // The instruments this determination was made with. Optional — the
  // register starts empty — but any instrument named here is checked, and
  // one without a CRA approval on file is refused.
  InstrumentRefs instruments = 10;
}
message RegaugeBarrelResponse {
  BarrelEvent event = 1;
  Barrel barrel = 2;
  double lost_laa = 3;
  // Conditions that did not block the determination but that an operator
  // and an auditor both want to see — an instrument past due for
  // calibration is still approved, so it is a warning, not a refusal.
  repeated string warnings = 4;
}

message VoidBarrelEventRequest {
  string id = 1;
  string reason = 2;
}
message VoidBarrelEventResponse {}

service BarrelService {
  rpc CreateBarrel(CreateBarrelRequest) returns (CreateBarrelResponse);
  rpc ListBarrels(ListBarrelsRequest) returns (ListBarrelsResponse);
  rpc GetBarrel(GetBarrelRequest) returns (GetBarrelResponse);
  rpc FillBarrel(FillBarrelRequest) returns (FillBarrelResponse);
  rpc DumpBarrel(DumpBarrelRequest) returns (DumpBarrelResponse);
  rpc RegaugeBarrel(RegaugeBarrelRequest) returns (RegaugeBarrelResponse);
  rpc VoidBarrelEvent(VoidBarrelEventRequest) returns (VoidBarrelEventResponse);
}
