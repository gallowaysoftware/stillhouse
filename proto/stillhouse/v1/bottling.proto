syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";

message BottlingRun {
  string id = 1;
  string tenant_id = 2;
  int32  run_no = 3;
  string product_id = 4;
  string product_name = 5;             // denormalized for list views
  int32  product_bottle_size_ml = 6;
  double product_target_abv_pct = 7;
  string source_container_id = 8;
  string destination_jurisdiction = 9;
  string bottling_date = 10;           // ISO date
  int32  bottle_count = 11;
  double bottling_loss_l = 12;
  string lot_code = 13;
  double tank_gauge_volume_l = 14;
  double tank_gauge_abv_pct = 15;
  double tank_gauge_laa = 16;
  string bulk_movement_id = 17;
  string notes = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
  google.protobuf.Timestamp voided_at = 21;
  string voided_by = 22;
  string voided_reason = 23;

  // Duty crystallised at this run, for a tenant whose duty point is
  // AT_PACKAGING. Zero for an at-removal tenant and for runs dated before
  // the tenant's duty-point cutover — that stock is dutied on removal
  // instead, so it is never dutied twice and never dutied never.
  //
  // duty_rate_per_laa is 0 for the at-or-under-7% band, which is charged
  // per litre of product rather than per litre of absolute alcohol.
  bool   duty_paid_at_packaging = 24;
  double duty_rate_per_laa = 25;
  double duty_amount_cad = 26;
  // The CRA notice the rate was read from, so a figure on a filed return
  // can be checked against its source years later.
  string duty_rate_source = 27;

  repeated BottlingRunStampUsage stamp_usage = 30;
}

message BottlingRunStampUsage {
  string id = 1;
  string bottling_run_id = 2;
  string stamp_order_id = 3;
  string jurisdiction = 4;
  int32  bottle_count = 5;
  string serial_start = 6;
  string serial_end = 7;
  int32  voids = 8;
  google.protobuf.Timestamp created_at = 9;
}

message PackagedInventoryRow {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  int32  bottle_size_ml = 4;
  double target_abv_pct = 5;
  string lot_code = 6;
  string jurisdiction = 7;
  int32  bottles_on_hand = 8;
  int32  bottles_packaged = 9;
  int32  bottles_removed = 10;
  google.protobuf.Timestamp updated_at = 11;
  string first_bottled_date = 12;       // ISO; empty if pre-bottling-run linkage

  // Batch release. Both can be set at once: a lot held after release is
  // a recall in its early form, and erasing the release would remove the
  // most important part of that record.
  google.protobuf.Timestamp released_at = 13;
  string released_by_name = 14;
  string release_notes = 15;
  google.protobuf.Timestamp held_at = 16;
  string held_by_name = 17;
  string hold_reason = 18;
  // The run behind the lot, so a release decision can see its lab
  // results. Empty for adopted stock, which has no run.
  string bottling_run_id = 19;
  // Whose the bottles are. Copied from the vessel at the run, so a cask
  // sold in place afterwards does not restate a closed period. Empty
  // means the licensee's — which is every lot packaged before stage 183,
  // and true of them.
  string owner_customer_id = 20;
  string owner_name = 21;
}

// --- requests ---

message CreateBottlingRunRequest {
  string product_id = 1;
  string source_container_id = 2;
  string destination_jurisdiction = 3;
  string bottling_date = 4;             // ISO; empty = today
  int32  bottle_count = 5;
  double bottling_loss_l = 6;
  string lot_code = 7;
  string notes = 8;
}
message CreateBottlingRunResponse {
  BottlingRun run = 1;
  PackagedInventoryRow packaged = 2;
}

message GetBottlingRunRequest { string id = 1; }
message GetBottlingRunResponse { BottlingRun run = 1; }

message ListBottlingRunsRequest {
  int32 limit = 1;             // 0 = server default (100); max 500
  int32 offset = 2;
  string period_start = 3;     // optional ISO date, inclusive
  string period_end = 4;       // optional ISO date, inclusive
}
message ListBottlingRunsResponse {
  repeated BottlingRun runs = 1;
  int32 total_count = 2;       // total matching the filters; for pagination
}

message ListPackagedInventoryRequest { bool include_empty = 1; }
message ListPackagedInventoryResponse { repeated PackagedInventoryRow rows = 1; }

message VoidBottlingRunRequest {
  string id = 1;
  string reason = 2;
}
message VoidBottlingRunResponse { BottlingRun run = 1; }

service BottlingService {
  rpc CreateBottlingRun(CreateBottlingRunRequest) returns (CreateBottlingRunResponse);
  rpc GetBottlingRun(GetBottlingRunRequest) returns (GetBottlingRunResponse);
  rpc ListBottlingRuns(ListBottlingRunsRequest) returns (ListBottlingRunsResponse);
  rpc ListPackagedInventory(ListPackagedInventoryRequest) returns (ListPackagedInventoryResponse);
  rpc VoidBottlingRun(VoidBottlingRunRequest) returns (VoidBottlingRunResponse);
}
