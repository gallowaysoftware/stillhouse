// Bulk alcohol ledger. The first BulkMovement for any new alcohol comes from
// a production gauge (Stage 4) — that's the bridge between operational
// production records and the compliance spine that eventually feeds B266.
syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";
import "stillhouse/v1/alcoholometry.proto";
import "stillhouse/v1/instrument.proto";

enum BulkContainerKind {
  BULK_CONTAINER_KIND_UNSPECIFIED = 0;
  BULK_CONTAINER_KIND_SPIRIT_RECEIVER = 1;
  BULK_CONTAINER_KIND_TANK = 2;
  BULK_CONTAINER_KIND_IBC = 3;
  BULK_CONTAINER_KIND_TOTE = 4;
  BULK_CONTAINER_KIND_BLEND_TANK = 5;
  BULK_CONTAINER_KIND_BOTTLING_TANK = 6;
  BULK_CONTAINER_KIND_OTHER = 7;
}

enum BulkMovementReason {
  BULK_MOVEMENT_REASON_UNSPECIFIED = 0;
  BULK_MOVEMENT_REASON_PRODUCTION_GAUGE = 1;
  BULK_MOVEMENT_REASON_INTER_TANK_TRANSFER = 2;
  BULK_MOVEMENT_REASON_BLEND = 3;
  BULK_MOVEMENT_REASON_TRANSFER_IN_BOND = 4;
  BULK_MOVEMENT_REASON_TRANSFER_OUT_IN_BOND = 5;
  BULK_MOVEMENT_REASON_TRANSFER_TO_PACKAGING = 6;
  BULK_MOVEMENT_REASON_LOSS_EVAPORATION = 7;
  BULK_MOVEMENT_REASON_LOSS_UNACCOUNTED = 8;
  BULK_MOVEMENT_REASON_REGAUGE_CORRECTION = 9;
  BULK_MOVEMENT_REASON_DESTRUCTION = 10;
  // Alcohol already on hand when the distillery adopted Stillhouse. Not
  // production — it flows into the B266's opening balance rather than
  // into what the distillery made this period.
  BULK_MOVEMENT_REASON_OPENING_INVENTORY = 11;
  // Reason-coded reconciliation of book stock to physical — B266 line D.
  BULK_MOVEMENT_REASON_ADJUSTMENT_INCREASE = 12;
  BULK_MOVEMENT_REASON_ADJUSTMENT_DECREASE = 13;
  // The rest of EDM10-1-7 page 3.
  BULK_MOVEMENT_REASON_IMPORT_RECEIVED = 14;
  BULK_MOVEMENT_REASON_RECEIVED_FROM_SPIRITS_LICENSEE = 15;
  BULK_MOVEMENT_REASON_RECEIVED_FROM_LICENSED_USER = 16;
  BULK_MOVEMENT_REASON_PACKAGED_RETURNED_TO_BULK = 17;
  BULK_MOVEMENT_REASON_DELIVERED_TO_SPIRITS_LICENSEE = 18;
  BULK_MOVEMENT_REASON_DELIVERED_TO_LICENSED_USER = 19;
  BULK_MOVEMENT_REASON_EXPORTED = 20;
  BULK_MOVEMENT_REASON_DENATURED_DA = 21;
  BULK_MOVEMENT_REASON_DENATURED_SDA = 22;
  BULK_MOVEMENT_REASON_RETURNED_TO_PRODUCTION = 23;
}

message BulkContainer {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  BulkContainerKind kind = 4;
  double capacity_l = 5;
  bool   capacity_l_set = 6;
  string location = 7;
  string notes = 8;
  bool   archived = 9;

  // Current running balance.
  double current_volume_l = 10;
  double current_abv_pct = 11;
  bool   current_abv_pct_set = 12;
  double current_laa = 13;

  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // Last bulk_movement timestamp touching this container (as source or dest).
  // Unset if the container has never moved alcohol — caller should fall back
  // to created_at to compute "days since activity".
  google.protobuf.Timestamp last_movement_at = 16;

  // Who owns the spirits, and whether we hold them. Two separate facts:
  // ownership decides whether the alcohol is an asset, possession decides
  // whether it goes on our B266, and a contract distillery has containers
  // in every combination.
  //
  // Empty owner_customer_id means the licensee owns it.
  string owner_customer_id = 17;
  string owner_name = 18;
  BulkPossession possession = 19;
  string held_by_name = 20;
  string held_by_licence_no = 21;
  google.protobuf.Timestamp possession_changed_at = 22;
}

// Whether the spirits are on our premises. EDM10-1-7 page 3: report all
// bulk spirits in your possession regardless of who owns them, and do not
// report spirits you own but do not hold.
enum BulkPossession {
  BULK_POSSESSION_UNSPECIFIED = 0;
  BULK_POSSESSION_HELD = 1;
  BULK_POSSESSION_HELD_ELSEWHERE = 2;
}

message BulkMovement {
  string id = 1;
  string source_container_id = 2;        // empty if originating event
  string source_container_name = 3;
  string destination_container_id = 4;   // empty if loss / transfer-out
  string destination_container_name = 5;
  double volume_l = 6;
  double abv_pct = 7;
  double laa = 8;
  BulkMovementReason reason = 9;
  string reference_type = 10;
  string reference_id = 11;
  string notes = 12;
  google.protobuf.Timestamp occurred_at = 13;
  google.protobuf.Timestamp created_at = 14;

  // Who the alcohol came from or went to, and the document that says so.
  // Set on movements recorded directly rather than as a side effect of
  // another action.
  string counterparty_name = 15;
  string counterparty_licence_no = 16;
  string document_reference = 17;
  string recorded_by = 18;

  // The determination behind an external movement, where one was made.
  double temperature_c = 20;
  bool   temperature_c_set = 21;
  double observed_volume_l = 22;
  double observed_density_kg_m3 = 23;
  bool   observed_density_kg_m3_set = 24;
  double volume_factor_c = 25;
  StrengthSource strength_source = 26;
  DeterminationInstruments instruments = 27;

  // Set on a packaged-spirits-returned-to-bulk movement.
  string packaged_inventory_id = 30;
  int32  bottles_unpackaged = 31;

  // Set on a loss or a destruction.
  LossDutyTreatment loss_duty_treatment = 32;
  string loss_treatment_authority = 33;
}

message BulkSummary {
  // Kept as it was: every non-archived non-barrel container, whoever owns
  // it and wherever it is. The figures below say what it is made of, and
  // are what a screen should use once the two stop being the same number.
  double total_laa = 1;
  int32  container_count = 2;

  // Ours, wherever it is — what the balance sheet means.
  double owned_laa = 3;
  // Here, whoever owns it — what the B266 means.
  double held_laa = 4;
  // Ours and here: what could actually be blended, reduced or bottled.
  double available_laa = 5;
  // Somebody else's, on our floor. On our return, not on our books.
  double held_for_others_laa = 6;
  // Ours, somewhere else. On our books, not on our return.
  double held_elsewhere_laa = 7;
  int32  third_party_count = 8;
}

// --- requests ---

message CreateBulkContainerRequest {
  string name = 1;
  BulkContainerKind kind = 2;
  double capacity_l = 3;
  bool   capacity_l_set = 4;
  string location = 5;
  string notes = 6;
}
message CreateBulkContainerResponse { BulkContainer container = 1; }

message UpdateBulkContainerRequest {
  string id = 1;
  string name = 2;
  BulkContainerKind kind = 3;
  double capacity_l = 4;
  bool   capacity_l_set = 5;
  string location = 6;
  string notes = 7;
}
message UpdateBulkContainerResponse { BulkContainer container = 1; }

message SetBulkContainerArchivedRequest { string id = 1; bool archived = 2; }
message SetBulkContainerArchivedResponse { BulkContainer container = 1; }

message ListBulkContainersRequest { bool include_archived = 1; }
message ListBulkContainersResponse {
  repeated BulkContainer containers = 1;
  BulkSummary summary = 2;
}

message GetBulkContainerRequest { string id = 1; }
message GetBulkContainerResponse {
  BulkContainer container = 1;
  repeated BulkMovement movements = 2;
}

message ListRecentBulkMovementsRequest {}
message ListRecentBulkMovementsResponse { repeated BulkMovement movements = 1; }

message BlendSourceInput {
  string source_container_id = 1;
  double volume_l = 2;            // amount drawn from this source
}

message CreateBlendRequest {
  string destination_container_id = 1;        // must be blend_tank (or tank) kind
  repeated BlendSourceInput sources = 2;       // ≥2 sources required
  string notes = 3;
  google.protobuf.Timestamp occurred_at = 4;   // unset = now
}
message CreateBlendResponse {
  BulkContainer destination = 1;
  repeated BulkMovement movements = 2;         // one per source
}

// AdoptOpeningInventory books stock that was already in the warehouse when
// the distillery started using Stillhouse — casks with no mash, no
// fermentation and no distillation run behind them.
//
// The measurement follows CRA's Mass/Density Procedure where a scale is
// available, because that is both the more accurate route and the one the
// published tables are built for: kilograms × A gives litres at 20 °C, and
// the hydrometer indication gives the strength. A dipped volume works too.
message AdoptOpeningInventoryRequest {
  string container_id = 1;

  // Scale reading in kilograms. Preferred: mass needs no temperature
  // correction of its own and doesn't contract.
  double mass_kg = 2;
  bool   mass_kg_set = 3;
  // Or a dipped volume, in litres as measured.
  double volume_l = 4;
  bool   volume_l_set = 5;

  // Hydrometer indication in kg/m³, read at temperature_c. CRA's approved
  // instrument reads density, not %ABV.
  double density_kg_m3 = 6;
  bool   density_kg_m3_set = 7;
  // Strength at 20 °C, when the instrument already corrects. Ignored when
  // density_kg_m3 is supplied.
  double abv_pct = 8;
  double temperature_c = 9;
  bool   temperature_c_set = 10;

  // ISO date the cask was originally filled. Sets the maturation clock, so
  // adopted whisky keeps the age it actually has — without this a
  // three-year-old cask would restart at zero and lose its Canadian Whisky
  // eligibility.
  string fill_date = 11;
  // When this stock was on hand. Defaults to now; back-date it to the
  // start of your first reporting period.
  google.protobuf.Timestamp as_of = 12;
  string notes = 13;
}
message AdoptOpeningInventoryResponse {
  BulkContainer container = 1;
  BulkMovement movement = 2;
  // What the measurement resolved to, so the operator can check it against
  // their own paperwork before trusting the balance.
  double volume_l_20c = 3;
  double strength_pct_20c = 4;
  double laa = 5;
}

// Why the book and the physical stock disagreed. Line D on B266 page 3 is
// a reason-coded entry, not a free-text correction.
enum InventoryAdjustmentReason {
  INVENTORY_ADJUSTMENT_REASON_UNSPECIFIED = 0;
  // Stock was counted or gauged and differs from the ledger.
  INVENTORY_ADJUSTMENT_REASON_PHYSICAL_COUNT = 1;
  // An earlier determination was wrong: instrument error, arithmetic, a
  // reading taken at the wrong temperature.
  INVENTORY_ADJUSTMENT_REASON_MEASUREMENT_CORRECTION = 2;
  // A keying mistake in Stillhouse itself.
  INVENTORY_ADJUSTMENT_REASON_DATA_ENTRY_ERROR = 3;
  INVENTORY_ADJUSTMENT_REASON_OTHER = 4;
}

// An adjustment reconciling one container's book balance to what was
// physically found. It is a determination like any other gauge — same
// 20 °C correction, same instruments — and what makes it different is that
// it says why, names who, and keeps the book figure beside the counted one.
message InventoryAdjustment {
  string id = 1;
  string container_id = 2;
  string container_name = 3;
  string bulk_movement_id = 4;        // empty when the count confirmed the book

  InventoryAdjustmentReason reason = 5;
  string explanation = 6;

  // What the ledger said, immediately before.
  double book_volume_l = 10;
  double book_abv_pct = 11;
  bool   book_abv_pct_set = 12;
  double book_laa = 13;
  // What was found, corrected to 20 °C.
  double counted_volume_l = 14;
  double counted_abv_pct = 15;
  bool   counted_abv_pct_set = 16;
  double counted_laa = 17;
  // Signed: negative when the count found less than the book.
  double delta_laa = 18;
  double delta_volume_l = 19;

  // The determination trail.
  double temperature_c = 20;
  bool   temperature_c_set = 21;
  double observed_volume_l = 22;
  double observed_density_kg_m3 = 23;
  bool   observed_density_kg_m3_set = 24;
  double volume_factor_c = 25;
  StrengthSource strength_source = 26;
  DeterminationInstruments instruments = 27;

  string adjusted_by = 30;
  string adjusted_by_name = 31;
  string notes = 32;
  google.protobuf.Timestamp occurred_at = 33;
  google.protobuf.Timestamp created_at = 34;
}

message RecordInventoryAdjustmentRequest {
  string container_id = 1;
  InventoryAdjustmentReason reason = 2;
  string explanation = 3;             // required

  // The count, in the same shape every gauging call takes.
  double counted_volume_l = 4;
  double abv_pct = 5;
  double temperature_c = 6;
  bool   temperature_c_set = 7;
  double density_kg_m3 = 8;
  bool   density_kg_m3_set = 9;

  google.protobuf.Timestamp occurred_at = 10;
  string notes = 11;
  InstrumentRefs instruments = 12;
}
message RecordInventoryAdjustmentResponse {
  InventoryAdjustment adjustment = 1;
  BulkContainer container = 2;
  repeated string warnings = 3;
}

message ListInventoryAdjustmentsRequest {
  string container_id = 1;            // optional; empty = every container
  string period_start = 2;            // optional ISO date, inclusive
  string period_end = 3;              // optional ISO date, inclusive
}
message ListInventoryAdjustmentsResponse {
  repeated InventoryAdjustment adjustments = 1;
}

// The reportable movements of bulk spirits into and out of the premises —
// B266 page 3 against EDM10-1-7.
//
// These are the lines Stillhouse could not produce. Four of them
// (IN_BOND_IN, IN_BOND_OUT, DESTRUCTION, UNACCOUNTED_LOSS) were on the
// report from the beginning and structurally always zero, because nothing
// in the application ever wrote one.
//
// Marked special containers are absent deliberately: they are packaging,
// not bulk, and need their own model (PLAN B3).
enum BulkExternalMovementKind {
  BULK_EXTERNAL_MOVEMENT_KIND_UNSPECIFIED = 0;

  // --- receipts: alcohol arriving on the premises ---
  BULK_EXTERNAL_MOVEMENT_KIND_IMPORT = 1;
  BULK_EXTERNAL_MOVEMENT_KIND_IN_BOND_IN = 2;
  BULK_EXTERNAL_MOVEMENT_KIND_FROM_SPIRITS_LICENSEE = 3;
  BULK_EXTERNAL_MOVEMENT_KIND_FROM_LICENSED_USER = 4;
  // Packaged spirits unpackaged back to bulk. Decrements packaged
  // inventory, so it carries the lot and the bottle count.
  BULK_EXTERNAL_MOVEMENT_KIND_PACKAGED_RETURNED_TO_BULK = 5;

  // --- dispositions: alcohol leaving ---
  BULK_EXTERNAL_MOVEMENT_KIND_IN_BOND_OUT = 10;
  BULK_EXTERNAL_MOVEMENT_KIND_TO_SPIRITS_LICENSEE = 11;
  BULK_EXTERNAL_MOVEMENT_KIND_TO_LICENSED_USER = 12;
  BULK_EXTERNAL_MOVEMENT_KIND_EXPORT = 13;
  BULK_EXTERNAL_MOVEMENT_KIND_DENATURED_DA = 14;
  BULK_EXTERNAL_MOVEMENT_KIND_DENATURED_SDA = 15;
  // Back into the still. The records EDM3-1-1 para 38-41 wants around a
  // redistillation are PLAN A8; this is the reportable movement itself.
  BULK_EXTERNAL_MOVEMENT_KIND_RETURNED_TO_PRODUCTION = 16;
  BULK_EXTERNAL_MOVEMENT_KIND_DESTRUCTION = 17;
  BULK_EXTERNAL_MOVEMENT_KIND_UNACCOUNTED_LOSS = 18;
}

message RecordBulkExternalMovementRequest {
  string container_id = 1;
  BulkExternalMovementKind kind = 2;

  // The gauge, in the same shape every other determination takes.
  // Receiving spirit in bond means gauging it, and that gauge is subject
  // to the same instrument approval as any other.
  double volume_l = 3;
  double abv_pct = 4;
  double temperature_c = 5;
  bool   temperature_c_set = 6;
  double density_kg_m3 = 7;
  bool   density_kg_m3_set = 8;
  InstrumentRefs instruments = 9;

  // Who it came from or went to, and the document that says so. EDM10-1-7
  // does not want a bare quantity on the "received from other spirits
  // licensees" line — the counterparty is what makes the movement
  // traceable to the other end of it.
  string counterparty_name = 10;
  string counterparty_licence_no = 11;
  string document_reference = 12;

  google.protobuf.Timestamp occurred_at = 13;
  string notes = 14;

  // Required for PACKAGED_RETURNED_TO_BULK, ignored otherwise.
  string packaged_inventory_id = 15;
  int32  bottles_unpackaged = 16;

  // For a loss or a destruction: how it is treated for duty, and the
  // authority relief rests on. An operator destroying spirits under a CRA
  // approval has the approval in front of them, so the classification
  // belongs here rather than as a second trip. Ignored for every other
  // kind.
  LossDutyTreatment loss_duty_treatment = 17;
  string loss_treatment_authority = 18;
}
message RecordBulkExternalMovementResponse {
  BulkMovement movement = 1;
  BulkContainer container = 2;
  repeated string warnings = 3;
}

// How a loss is treated for duty. EDM3-4-1: a destruction approved by CRA
// is relieved, while spirits that cannot be accounted for are duty-payable.
// Collapsing the two produces a plausible total and the wrong duty.
enum LossDutyTreatment {
  LOSS_DUTY_TREATMENT_UNSPECIFIED = 0;
  // Nobody has said yet. The honest default: Stillhouse does not know
  // whether a given evaporation loss is relieved, and the barrel regauge
  // that wrote it did not ask. Reported on the return as outstanding.
  LOSS_DUTY_TREATMENT_UNCLASSIFIED = 1;
  // Relieved under EDM3-4-1. Relief rests on something, so an authority is
  // required — a CRA approval reference, or the provision relied on.
  LOSS_DUTY_TREATMENT_RELIEVED = 2;
  // Duty is payable on these litres.
  LOSS_DUTY_TREATMENT_DUTIABLE = 3;
}

// One loss awaiting a duty treatment, or carrying one.
message ClassifiableLoss {
  string movement_id = 1;
  BulkMovementReason reason = 2;
  string container_name = 3;
  double laa = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string notes = 6;
  string document_reference = 7;

  LossDutyTreatment treatment = 10;
  string treatment_authority = 11;
  string classified_by = 12;
  google.protobuf.Timestamp classified_at = 13;
  // What duty these litres would attract if dutiable, at the rate in force
  // on the day of the loss. Shown against an unclassified loss so the
  // decision is made with its cost visible.
  double duty_if_dutiable_cad = 14;
}

message ListLossesRequest {
  string period_start = 1;            // optional ISO date, inclusive
  string period_end = 2;              // optional ISO date, inclusive
  // Only losses nobody has ruled on yet — what has to be resolved before a
  // return can be filed.
  bool unclassified_only = 3;
}
message ListLossesResponse {
  repeated ClassifiableLoss losses = 1;
  double unclassified_laa = 2;
  double dutiable_laa = 3;
  double relieved_laa = 4;
}

message ClassifyLossesRequest {
  // Several at once: an operator resolving a period's evaporation losses is
  // making one decision about a dozen rows, not a dozen decisions.
  repeated string movement_ids = 1;
  LossDutyTreatment treatment = 2;
  // Required when the treatment is RELIEVED. Relief that rests on nothing
  // is not relief.
  string authority = 3;
}
message ClassifyLossesResponse {
  repeated ClassifiableLoss losses = 1;
}

service BulkService {
  // Losses, and what duty treatment each carries.
  rpc ListLosses(ListLossesRequest) returns (ListLossesResponse);
  rpc ClassifyLosses(ClassifyLossesRequest) returns (ClassifyLossesResponse);
  // Record bulk spirits arriving on or leaving the premises — the B266
  // page 3 lines that had no path.
  rpc RecordBulkExternalMovement(RecordBulkExternalMovementRequest) returns (RecordBulkExternalMovementResponse);
  // Reconcile a container's book balance to what was physically found.
  rpc RecordInventoryAdjustment(RecordInventoryAdjustmentRequest) returns (RecordInventoryAdjustmentResponse);
  rpc ListInventoryAdjustments(ListInventoryAdjustmentsRequest) returns (ListInventoryAdjustmentsResponse);
  rpc CreateBulkContainer(CreateBulkContainerRequest) returns (CreateBulkContainerResponse);
  rpc UpdateBulkContainer(UpdateBulkContainerRequest) returns (UpdateBulkContainerResponse);
  rpc SetBulkContainerArchived(SetBulkContainerArchivedRequest) returns (SetBulkContainerArchivedResponse);
  rpc ListBulkContainers(ListBulkContainersRequest) returns (ListBulkContainersResponse);
  rpc GetBulkContainer(GetBulkContainerRequest) returns (GetBulkContainerResponse);
  rpc ListRecentBulkMovements(ListRecentBulkMovementsRequest) returns (ListRecentBulkMovementsResponse);
  rpc CreateBlend(CreateBlendRequest) returns (CreateBlendResponse);
  rpc AdoptOpeningInventory(AdoptOpeningInventoryRequest) returns (AdoptOpeningInventoryResponse);

  // Who owns what is in a container, and whether we still hold it.
  rpc SetBulkContainerOwner(SetBulkContainerOwnerRequest) returns (SetBulkContainerOwnerResponse);
  rpc SetBulkContainerPossession(SetBulkContainerPossessionRequest) returns (SetBulkContainerPossessionResponse);
  rpc ListThirdPartySpirits(ListThirdPartySpiritsRequest) returns (ListThirdPartySpiritsResponse);
}

message SetBulkContainerOwnerRequest {
  string id = 1;
  // Empty means the licensee owns it.
  string owner_customer_id = 2;
}
message SetBulkContainerOwnerResponse { BulkContainer container = 1; }

message SetBulkContainerPossessionRequest {
  string id = 1;
  BulkPossession possession = 2;
  // Required when the spirits are leaving: a return that omits stock has
  // to be able to say where it went.
  string held_by_name = 3;
  string held_by_licence_no = 4;
  // ISO date the spirits changed hands; empty = today. This is the date
  // the in-bond transfer movement carries, so it decides which return it
  // lands on.
  string occurred_on = 5;
  string document_reference = 6;
  string notes = 7;
}
message SetBulkContainerPossessionResponse {
  BulkContainer container = 1;
  // The in-bond transfer this wrote. A change of possession is a
  // reportable movement, not a flag — see the migration.
  BulkMovement movement = 2;
}

message ListThirdPartySpiritsRequest {}
message ListThirdPartySpiritsResponse {
  // Everything that is not simply ours-and-here.
  repeated BulkContainer containers = 1;
  double held_for_others_laa = 2;
  double held_elsewhere_laa = 3;
}
