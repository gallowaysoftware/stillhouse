syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";
import "stillhouse/v1/instrument.proto";
import "stillhouse/v1/alcoholometry.proto";
import "stillhouse/v1/bulk.proto";

enum DistillationStatus {
  DISTILLATION_STATUS_UNSPECIFIED = 0;
  DISTILLATION_STATUS_PLANNED = 1;
  DISTILLATION_STATUS_CHARGING = 2;
  DISTILLATION_STATUS_DISTILLING = 3;
  DISTILLATION_STATUS_GAUGED = 4;
  DISTILLATION_STATUS_CANCELLED = 5;
}

enum DistillationCutKind {
  DISTILLATION_CUT_KIND_UNSPECIFIED = 0;
  DISTILLATION_CUT_KIND_FORESHOTS = 1;
  DISTILLATION_CUT_KIND_HEADS = 2;
  DISTILLATION_CUT_KIND_HEARTS = 3;
  DISTILLATION_CUT_KIND_TAILS = 4;
  DISTILLATION_CUT_KIND_FEINTS_SAVED = 5;
}

message DistillationRun {
  string id = 1;
  string tenant_id = 2;
  int32  run_no = 3;
  string still_label = 4;
  string run_date = 5;             // ISO date
  DistillationStatus status = 6;
  string notes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;

  // Children, populated by GetDistillationRun.
  repeated DistillationCharge charges = 10;
  repeated DistillationCut cuts = 11;
  ProductionGauge gauge = 12;       // unset until RecordProductionGauge runs
  double total_cut_laa = 13;        // computed sum from cuts
  CutAnalysis cut_analysis = 17;    // populated by GetDistillationRun

  google.protobuf.Timestamp voided_at = 14;
  string voided_by = 15;
  string voided_reason = 16;
}

message DistillationCharge {
  string id = 1;
  string distillation_run_id = 2;
  string fermentation_run_id = 3;
  string fermenter_label = 4;
  int32  mash_no = 5;
  double volume_charged_l = 6;
  double abv_pct = 7;
  double laa = 8;                  // computed in service
  int32  charge_order = 9;
  string notes = 10;
}

message DistillationCut {
  string id = 1;
  string distillation_run_id = 2;
  DistillationCutKind kind = 3;
  double volume_l = 4;
  double abv_pct = 5;
  double laa = 6;
  int32  cut_order = 7;
  google.protobuf.Timestamp observed_at = 8;
  string notes = 9;
}

enum CutFindingSeverity {
  CUT_FINDING_SEVERITY_UNSPECIFIED = 0;
  CUT_FINDING_SEVERITY_INFO = 1;
  CUT_FINDING_SEVERITY_WARNING = 2;
  CUT_FINDING_SEVERITY_PROBLEM = 3;
}

message CutFinding {
  CutFindingSeverity severity = 1;
  string code = 2;
  string title = 3;
  string detail = 4;
}

// CutAnalysis is what a run's cuts add up to.
//
// The judgements are limited to what holds for any spirit. Cut points are
// not universal — a wash run's heads and tails cuts sit at 54 % and 48 %
// ABV, while a botanical spirit's tails are diverted between 30 % and 20 %
// — so the hearts window is reported as a figure and the judgement is left
// to the distiller. What is checked is arithmetic that must hold either
// way: you cannot collect more alcohol than you charged, and strength
// falls as a run proceeds.
message CutAnalysis {
  double charge_laa = 1;
  double cut_laa = 2;
  // Cut LAA over charge LAA. The shortfall is the run's real losses —
  // vapour that never condensed, and what stayed in the pot and the line.
  double accounted_pct = 3;

  double hearts_laa = 4;
  double hearts_share_pct = 5;
  // The strength at the first and last hearts fraction: the cut points the
  // distiller actually took, and the number worth comparing between runs
  // of the same spirit.
  double hearts_start_abv = 6;
  double hearts_end_abv = 7;
  bool   hearts_set = 8;

  repeated CutFinding findings = 9;
}

message ProductionGauge {
  string id = 1;
  string distillation_run_id = 2;
  string destination_container_id = 3;
  string destination_container_name = 4;
  string bulk_movement_id = 5;
  google.protobuf.Timestamp gauge_date = 6;
  // volume_l / abv_pct / laa are the values AT 20 °C — the pair the B266
  // is built from. observed_* below preserve what the operator read off
  // the instrument, so a gauge can be audited back to the bench.
  double volume_l = 7;
  double abv_pct = 8;
  double temperature_c = 9;
  bool   temperature_c_set = 10;
  double laa = 11;
  string gauger_user_id = 12;
  string notes = 13;

  // As observed, before correction to 20 °C.
  double observed_volume_l = 14;
  double observed_density_kg_m3 = 15;
  bool   observed_density_kg_m3_set = 16;
  // C — the factor applied to observed_volume_l to reach volume_l.
  double volume_factor_c = 17;
  StrengthSource strength_source = 18;

  // The instruments the determination was made with, resolved. This is the
  // last link in the audit chain: quantity → movement → determination →
  // the approved instrument that made it (EDM3-1-1 ¶24, EDM1-1-5). Unset
  // on rows recorded before the register existed, which is honest — they
  // name no instrument because none was named.
  DeterminationInstruments instruments = 19;
}

// --- requests ---

message CreateDistillationRunRequest {
  string still_label = 1;
  string run_date = 2;             // ISO; empty = today
  string notes = 3;
}
message CreateDistillationRunResponse { DistillationRun run = 1; }

message GetDistillationRunRequest { string id = 1; }
message GetDistillationRunResponse { DistillationRun run = 1; }

message ListDistillationRunsRequest { DistillationStatus status = 1; }
message ListDistillationRunsResponse { repeated DistillationRun runs = 1; }

message UpdateDistillationStatusRequest { string id = 1; DistillationStatus status = 2; }
message UpdateDistillationStatusResponse { DistillationRun run = 1; }

message AddDistillationChargeRequest {
  string distillation_run_id = 1;
  string fermentation_run_id = 2;
  double volume_charged_l = 3;
  double abv_pct = 4;
  int32  charge_order = 5;
  string notes = 6;
}
message AddDistillationChargeResponse { DistillationCharge charge = 1; }

message AddDistillationCutRequest {
  string distillation_run_id = 1;
  DistillationCutKind kind = 2;
  double volume_l = 3;
  double abv_pct = 4;
  int32  cut_order = 5;
  google.protobuf.Timestamp observed_at = 6;
  string notes = 7;
}
message AddDistillationCutResponse { DistillationCut cut = 1; }

message UpdateDistillationCutRequest {
  string id = 1;
  DistillationCutKind kind = 2;
  double volume_l = 3;
  double abv_pct = 4;
  int32  cut_order = 5;
  google.protobuf.Timestamp observed_at = 6;
  string notes = 7;
}
message UpdateDistillationCutResponse { DistillationCut cut = 1; }

message DeleteDistillationCutRequest { string id = 1; }
message DeleteDistillationCutResponse {}

message RecordProductionGaugeRequest {
  string distillation_run_id = 1;
  string destination_container_id = 2;
  google.protobuf.Timestamp gauge_date = 3;
  // volume_l is the volume as gauged, at temperature_c.
  double volume_l = 4;
  // abv_pct is the strength at 20 °C when the instrument already corrects
  // (density meter), or when no temperature is supplied at all. Leave it
  // unset and send density_kg_m3 instead to have Stillhouse resolve the
  // strength through the published tables — CRA's approved path.
  double abv_pct = 5;
  double temperature_c = 6;
  bool   temperature_c_set = 7;
  string notes = 8;
  // Hydrometer indication in kg/m³, read at temperature_c.
  double density_kg_m3 = 9;
  bool   density_kg_m3_set = 10;
  // The instruments this determination was made with. Optional — the
  // register starts empty — but any instrument named here is checked, and
  // one without a CRA approval on file is refused.
  InstrumentRefs instruments = 11;
}
message RecordProductionGaugeResponse {
  ProductionGauge gauge = 1;
  BulkContainer destination_container = 2;
  // Conditions that did not block the determination but that an operator
  // and an auditor both want to see — an instrument past due for
  // calibration is still approved, so it is a warning, not a refusal.
  repeated string warnings = 3;
}

message VoidDistillationRunRequest {
  string id = 1;
  string reason = 2;
}
message VoidDistillationRunResponse { DistillationRun run = 1; }

service DistillationService {
  rpc CreateDistillationRun(CreateDistillationRunRequest) returns (CreateDistillationRunResponse);
  rpc GetDistillationRun(GetDistillationRunRequest) returns (GetDistillationRunResponse);
  rpc ListDistillationRuns(ListDistillationRunsRequest) returns (ListDistillationRunsResponse);
  rpc UpdateDistillationStatus(UpdateDistillationStatusRequest) returns (UpdateDistillationStatusResponse);
  rpc AddDistillationCharge(AddDistillationChargeRequest) returns (AddDistillationChargeResponse);
  rpc AddDistillationCut(AddDistillationCutRequest) returns (AddDistillationCutResponse);
  rpc RecordProductionGauge(RecordProductionGaugeRequest) returns (RecordProductionGaugeResponse);
  rpc VoidDistillationRun(VoidDistillationRunRequest) returns (VoidDistillationRunResponse);
  rpc UpdateDistillationCut(UpdateDistillationCutRequest) returns (UpdateDistillationCutResponse);
  rpc DeleteDistillationCut(DeleteDistillationCutRequest) returns (DeleteDistillationCutResponse);
}
