syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";
import "stillhouse/v1/material.proto";

enum MashStatus {
  MASH_STATUS_UNSPECIFIED = 0;
  MASH_STATUS_PLANNED = 1;
  MASH_STATUS_IN_PROGRESS = 2;
  MASH_STATUS_FERMENTING = 3;
  MASH_STATUS_DISTILLED = 4;
  MASH_STATUS_CANCELLED = 5;
}

enum MashMetricKind {
  MASH_METRIC_KIND_UNSPECIFIED = 0;
  MASH_METRIC_KIND_ORIGINAL_GRAVITY = 1;
  MASH_METRIC_KIND_MASH_PH = 2;
  MASH_METRIC_KIND_MASH_TEMP_C = 3;
  MASH_METRIC_KIND_WATER_VOLUME_L = 4;
  MASH_METRIC_KIND_STRIKE_TEMP_C = 5;
  MASH_METRIC_KIND_OTHER = 6;
  // Measured total volume of the mash/wash. A distilling wash isn't
  // lautered and boiled, so it's close to water + grain displacement —
  // but conversion efficiency is computed against it, so a measurement
  // beats an estimate.
  MASH_METRIC_KIND_WASH_VOLUME_L = 7;
}

// How serious a bench finding is. Advisory only — nothing here blocks a
// write.
enum MashFindingSeverity {
  MASH_FINDING_SEVERITY_UNSPECIFIED = 0;
  MASH_FINDING_SEVERITY_INFO = 1;
  MASH_FINDING_SEVERITY_WARNING = 2;
  MASH_FINDING_SEVERITY_PROBLEM = 3;
}

message MashFinding {
  MashFindingSeverity severity = 1;
  // Stable identifier so the UI can style or link a finding without
  // matching on prose.
  string code = 2;
  string title = 3;
  // The consequence — the part that changes what an operator does.
  string detail = 4;
}

// Inclusive temperature band, °C.
message TemperatureRange {
  double min_c = 1;
  double max_c = 2;
}

// MashEfficiency is conversion measured at the tun from original gravity,
// rather than inferred weeks later from what the still gave back.
message MashEfficiency {
  double original_gravity = 1;
  double plato = 2;
  double wash_volume_l = 3;
  // True when wash_volume_l was estimated from water + grain displacement
  // rather than measured.
  bool   wash_volume_estimated = 4;
  double extract_measured_kg = 5;
  double extract_available_kg = 6;
  double pct = 7;
}

// MashBench is the guidance derived from a mash's actual grain bill and
// recorded readings. Sourced from the IBD/CIBD distilling curriculum.
message MashBench {
  // The band the bill as a whole must reach to gelatinise: the hottest
  // requirement across its cereals.
  TemperatureRange gelatinisation_c = 1;
  // False when a fermentable has no published gelatinisation range, so
  // the requirement above may be understated.
  bool gelatinisation_known = 2;
  // Where the amylases work.
  TemperatureRange conversion_c = 3;
  // Set when the bill can't be gelatinised and converted in one rest —
  // maize and rice force a separate cereal cook.
  bool cereal_cook_required = 4;

  double thickness_l_per_kg = 5;
  bool   thickness_l_per_kg_set = 6;
  MashEfficiency efficiency = 7;
  bool   efficiency_set = 8;
  double total_grain_kg = 9;
  repeated MashFinding findings = 10;
}

message MashRun {
  string id = 1;
  string tenant_id = 2;
  string recipe_version_id = 3;
  int32  mash_no = 4;
  string mash_date = 5;            // ISO-8601 date, e.g. "2026-05-22"
  MashStatus status = 6;
  string notes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;

  // Denormalized for list views.
  string recipe_name = 10;
  int32  recipe_version_no = 11;

  // Children, populated by GetMashRun.
  repeated MashIngredientUsage ingredients = 12;
  repeated MashMetric metrics = 13;

  // Analytics, populated by GetMashRun.
  // projected_laa = sum(ingredient_used × material.extract × recipe.mash_eff
  //                     × 0.511 × recipe.ferment_eff / 0.78934 × recipe.distill_recov)
  // computed from actual ingredient usage using the recipe version's efficiency
  // parameters. Zero when no fermentable ingredients are recorded yet.
  double projected_laa = 14;
  // actual_captured_laa = sum of production_gauge.laa across distillations
  // that charged from any fermentation_run belonging to this mash. Zero
  // until the downstream distillation has been gauged.
  double actual_captured_laa = 15;

  // Mash bench guidance, populated by GetMashRun from the grain bill and
  // recorded metrics.
  MashBench bench = 16;
}

message MashIngredientUsage {
  string id = 1;
  string mash_run_id = 2;
  string material_id = 3;
  string material_name = 4;
  MaterialKind material_kind = 5;
  double material_extract_pct = 6;
  bool   material_extract_pct_set = 7;
  double quantity_used = 8;
  string uom = 9;
  string notes = 10;
  google.protobuf.Timestamp created_at = 11;
  string material_lot_id = 12;            // empty when not lot-linked
  string supplier_lot = 13;               // denormalized from material_lots
  google.protobuf.Timestamp lot_received_at = 14;
}

message MashMetric {
  string id = 1;
  string mash_run_id = 2;
  MashMetricKind kind = 3;
  double value = 4;
  string unit = 5;
  google.protobuf.Timestamp observed_at = 6;
  string notes = 7;
}

// ---------------------------------------------------------------------------

message CreateMashRunRequest {
  string recipe_version_id = 1;
  string mash_date = 2;            // ISO date; empty -> today
  string notes = 3;
}
message CreateMashRunResponse { MashRun mash_run = 1; }

message GetMashRunRequest { string id = 1; }
message GetMashRunResponse { MashRun mash_run = 1; }

message ListMashRunsRequest {
  string recipe_id = 1;        // optional filter
  MashStatus status = 2;       // optional; UNSPECIFIED = any
}
message ListMashRunsResponse { repeated MashRun mash_runs = 1; }

message UpdateMashStatusRequest { string id = 1; MashStatus status = 2; }
message UpdateMashStatusResponse { MashRun mash_run = 1; }

message AddMashIngredientRequest {
  string mash_run_id = 1;
  string material_id = 2;
  double quantity_used = 3;
  string uom = 4;
  string notes = 5;
  string material_lot_id = 6;            // optional; empty = not lot-linked
}
message AddMashIngredientResponse { MashIngredientUsage usage = 1; }

message AddMashMetricRequest {
  string mash_run_id = 1;
  MashMetricKind kind = 2;
  double value = 3;
  string unit = 4;
  google.protobuf.Timestamp observed_at = 5;   // unset = now
  string notes = 6;
}
message AddMashMetricResponse { MashMetric metric = 1; }

// PlanStrike answers the question asked while the liquor is heating: how
// hot does the water need to be so the grain lands on the rest temperature?
message PlanStrikeRequest {
  double target_temp_c = 1;
  double grain_temp_c = 2;
  double thickness_l_per_kg = 3;
  // Optional. When set, the response carries the liquor volume needed.
  double grain_kg = 4;
}
message PlanStrikeResponse {
  double strike_temp_c = 1;
  double water_volume_l = 2;
  repeated MashFinding findings = 3;
}

service MashService {
  rpc CreateMashRun(CreateMashRunRequest) returns (CreateMashRunResponse);
  rpc GetMashRun(GetMashRunRequest) returns (GetMashRunResponse);
  rpc ListMashRuns(ListMashRunsRequest) returns (ListMashRunsResponse);
  rpc UpdateMashStatus(UpdateMashStatusRequest) returns (UpdateMashStatusResponse);
  rpc AddMashIngredient(AddMashIngredientRequest) returns (AddMashIngredientResponse);
  rpc AddMashMetric(AddMashMetricRequest) returns (AddMashMetricResponse);
  rpc PlanStrike(PlanStrikeRequest) returns (PlanStrikeResponse);
}
