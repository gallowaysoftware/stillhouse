syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";

enum MaterialKind {
  MATERIAL_KIND_UNSPECIFIED = 0;
  MATERIAL_KIND_GRAIN = 1;
  MATERIAL_KIND_MALT = 2;
  MATERIAL_KIND_YEAST = 3;
  MATERIAL_KIND_WATER = 4;
  MATERIAL_KIND_NGS = 5;       // neutral grain spirit
  MATERIAL_KIND_BOTANICAL = 6;
  MATERIAL_KIND_PACKAGING = 7;
  MATERIAL_KIND_OTHER = 8;
}

// Cereal is the grain species. Gelatinisation temperature is a property of
// the starch granule — barley is fully gelatinised by 62 °C, maize needs
// 80 °C — so the species, not the malted/unmalted kind, drives mash
// temperature guidance. UNSPECIFIED means "not recorded", and the mash
// bench reports that rather than assuming a range.
enum Cereal {
  CEREAL_UNSPECIFIED = 0;
  CEREAL_BARLEY = 1;
  CEREAL_WHEAT = 2;
  CEREAL_RYE = 3;
  CEREAL_MAIZE = 4;
  CEREAL_RICE = 5;
  CEREAL_OAT = 6;
  CEREAL_OTHER = 7;
}

message Material {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  MaterialKind kind = 4;
  string uom = 5;          // 'kg' | 'L' | 'each' | etc.
  string supplier = 6;
  string notes = 7;
  // Fermentable-source parameters; only meaningful for kind in (GRAIN, MALT).
  // Both are fractions in [0,1]. Use the optional `_set` flags to disambiguate
  // "set to zero" from "not provided" on writes.
  // A proportion in [0,1], NOT a percentage — 0.78, not 78. Named
  // _fraction rather than _pct on purpose: abv_pct next door is 0–100,
  // and the two being a hundredfold apart under the same suffix is how
  // a strength gets divided by a hundred and duty gets understated.
  double extract_fraction = 8;
  bool   extract_fraction_set = 9;
  double moisture_fraction = 10;
  bool   moisture_fraction_set = 11;
  bool   archived = 12;
  // Grain species, for mash temperature guidance. Only meaningful for
  // kind in (GRAIN, MALT).
  Cereal cereal = 15;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message MaterialLot {
  string id = 1;
  string tenant_id = 2;
  string material_id = 3;
  string supplier_lot = 4;
  double quantity_received = 5;
  double quantity_on_hand = 6;
  google.protobuf.Timestamp received_at = 7;
  string notes = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  double unit_cost_cad = 11;          // CAD per UOM unit; 0 when not recorded
  bool   unit_cost_cad_set = 12;
}

// ---------------------------------------------------------------------------
// RPC payloads
// ---------------------------------------------------------------------------

message CreateMaterialRequest {
  string name = 1;
  MaterialKind kind = 2;
  string uom = 3;
  string supplier = 4;
  string notes = 5;
  double extract_fraction = 6;
  bool   extract_fraction_set = 7;
  double moisture_fraction = 8;
  bool   moisture_fraction_set = 9;
  Cereal cereal = 10;
}
message CreateMaterialResponse { Material material = 1; }

message UpdateMaterialRequest {
  string id = 1;
  string name = 2;
  string uom = 3;
  string supplier = 4;
  string notes = 5;
  double extract_fraction = 6;
  bool   extract_fraction_set = 7;
  double moisture_fraction = 8;
  bool   moisture_fraction_set = 9;
  Cereal cereal = 10;
}
message UpdateMaterialResponse { Material material = 1; }

message GetMaterialRequest { string id = 1; }
message GetMaterialResponse { Material material = 1; }

message ListMaterialsRequest {
  MaterialKind kind = 1;       // optional filter; UNSPECIFIED = any kind
  bool include_archived = 2;
}
message ListMaterialsResponse { repeated Material materials = 1; }

message ArchiveMaterialRequest { string id = 1; bool archived = 2; }
message ArchiveMaterialResponse { Material material = 1; }

message RecordMaterialReceiptRequest {
  string material_id = 1;
  string supplier_lot = 2;
  double quantity_received = 3;
  google.protobuf.Timestamp received_at = 4;
  string notes = 5;
  double unit_cost_cad = 6;
  bool   unit_cost_cad_set = 7;
}
message RecordMaterialReceiptResponse { MaterialLot lot = 1; }

message ListMaterialLotsRequest {
  string material_id = 1;      // optional filter
  bool on_hand_only = 2;
}
message ListMaterialLotsResponse { repeated MaterialLot lots = 1; }

message ProductCostSummaryRequest { string product_id = 1; }
message ProductCostSummaryResponse {
  string product_id = 1;
  int32  run_count = 2;             // non-voided bottling runs covered
  int32  total_bottles = 3;
  double total_material_cost_cad = 4;
  double average_material_cost_per_bottle_cad = 5;
  // Runs that hit a missing-price ingredient are flagged so the average
  // doesn't silently understate cost. UI should warn.
  int32  runs_with_missing_prices = 6;
}

message BottlingRunCostRequest { string bottling_run_id = 1; }
message BottlingRunCostLine {
  string material_name = 1;
  string supplier_lot = 2;
  double quantity_used = 3;
  string uom = 4;
  double unit_cost_cad = 5;
  double line_cost_cad = 6;
}
message BottlingRunCostResponse {
  string bottling_run_id = 1;
  int32  bottle_count = 2;
  double total_material_cost_cad = 3;
  double material_cost_per_bottle_cad = 4;
  // Lines that contributed to the total. Lines without a recorded
  // unit_cost_cad surface as line_cost_cad = 0 with unit_cost_cad = 0 so
  // the caller can warn about missing-price ingredients.
  repeated BottlingRunCostLine lines = 5;
}

// What is on hand, what it is going out at, and how long that lasts.
//
// Generalises what the excise stamp panel already does: usage a day over
// a window, divided into what is left. A material with no reorder point
// recorded is never alerted on and its cover reads as unknown rather
// than fine — a threshold Stillhouse guessed would fire at a level
// nobody chose.
message MaterialCover {
  string material_id = 1;
  string material_name = 2;
  MaterialKind kind = 3;
  string uom = 4;
  double on_hand = 5;
  // Already ordered and not yet received, so an alert does not fire on
  // something that is on a truck.
  double on_order = 6;
  double used_in_window = 7;
  int32  window_days = 8;
  // Per day over the window. Zero when nothing has consumed it, which is
  // why cover is then unknown rather than infinite.
  double daily_rate = 9;
  double cover_days = 10;
  bool   cover_known = 11;

  double reorder_point = 12;
  bool   reorder_point_set = 13;
  double reorder_quantity = 14;
  bool   reorder_quantity_set = 15;
  int32  lead_time_days = 16;
  bool   lead_time_days_set = 17;
  string preferred_supplier_name = 18;

  // Below the recorded reorder point, counting what is on order.
  bool   below_reorder_point = 19;
  // Cover is shorter than the lead time: ordering now is already late.
  bool   shorter_than_lead_time = 20;
}

message MaterialCoverRequest {
  // How far back to measure consumption. Empty is 90 days — long enough
  // that a distillery mashing weekly has several data points.
  int32 window_days = 1;
}
message MaterialCoverResponse {
  repeated MaterialCover materials = 1;
  int32 window_days = 2;
  string basis = 3;
}

message SetMaterialReorderRequest {
  string id = 1;
  // Each is optional and each clears when unset. There are no defaults:
  // a threshold nobody chose fires at a level nobody chose.
  double reorder_point = 2;
  bool   reorder_point_set = 3;
  double reorder_quantity = 4;
  bool   reorder_quantity_set = 5;
  int32  lead_time_days = 6;
  bool   lead_time_days_set = 7;
  string preferred_supplier_id = 8;
}
message SetMaterialReorderResponse { Material material = 1; }

service MaterialService {
  rpc MaterialCover(MaterialCoverRequest) returns (MaterialCoverResponse);
  rpc SetMaterialReorder(SetMaterialReorderRequest) returns (SetMaterialReorderResponse);
  rpc CreateMaterial(CreateMaterialRequest) returns (CreateMaterialResponse);
  rpc UpdateMaterial(UpdateMaterialRequest) returns (UpdateMaterialResponse);
  rpc GetMaterial(GetMaterialRequest) returns (GetMaterialResponse);
  rpc ListMaterials(ListMaterialsRequest) returns (ListMaterialsResponse);
  rpc ArchiveMaterial(ArchiveMaterialRequest) returns (ArchiveMaterialResponse);
  rpc RecordMaterialReceipt(RecordMaterialReceiptRequest) returns (RecordMaterialReceiptResponse);
  rpc ListMaterialLots(ListMaterialLotsRequest) returns (ListMaterialLotsResponse);
  rpc BottlingRunCost(BottlingRunCostRequest) returns (BottlingRunCostResponse);
  rpc ProductCostSummary(ProductCostSummaryRequest) returns (ProductCostSummaryResponse);
}
