syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";
import "stillhouse/v1/material.proto";

enum SpiritKind {
  SPIRIT_KIND_UNSPECIFIED = 0;
  SPIRIT_KIND_WHISKY = 1;
  SPIRIT_KIND_CANADIAN_WHISKY = 2;
  SPIRIT_KIND_RYE_WHISKY = 3;
  SPIRIT_KIND_GIN = 4;
  SPIRIT_KIND_VODKA = 5;
  SPIRIT_KIND_RUM = 6;
  SPIRIT_KIND_BRANDY = 7;
  SPIRIT_KIND_LIQUEUR = 8;
  SPIRIT_KIND_OTHER = 9;
}

// Where a botanical sits in the gin recipe's structure. Optional on
// every ingredient; ignored for non-gin recipes (and for non-botanical
// materials within a gin recipe — NGS, water, etc.).
enum BotanicalRole {
  BOTANICAL_ROLE_UNSPECIFIED = 0;
  BOTANICAL_ROLE_JUNIPER = 1;     // the defining note — every gin needs this
  BOTANICAL_ROLE_CITRUS = 2;      // lemon/lime/orange peels, grapefruit
  BOTANICAL_ROLE_HERBAL = 3;      // coriander, basil, sage
  BOTANICAL_ROLE_SPICE = 4;       // cardamom, cassia, black pepper
  BOTANICAL_ROLE_FLORAL = 5;      // rose, chamomile, elderflower
  BOTANICAL_ROLE_ROOT = 6;        // orris, angelica root, licorice
  BOTANICAL_ROLE_OTHER = 7;
}

// How the botanicals meet the spirit during distillation. Pot = full
// maceration in the still charge; vapor = botanicals in a gin basket
// extracted by ethanol vapor on the way up; combined = both.
enum DistillationMethod {
  DISTILLATION_METHOD_UNSPECIFIED = 0;
  DISTILLATION_METHOD_POT = 1;
  DISTILLATION_METHOD_VAPOR = 2;
  DISTILLATION_METHOD_COMBINED = 3;
}

message Recipe {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  SpiritKind spirit_kind = 4;
  bool archived = 5;
  string current_version_id = 6;   // empty until first version saved
  string notes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message RecipeVersion {
  string id = 1;
  string tenant_id = 2;
  string recipe_id = 3;
  int32 version_no = 4;
  string notes = 5;
  double mash_efficiency_pct = 6;
  double ferment_efficiency_pct = 7;
  double distillation_recovery_pct = 8;
  double target_water_l = 9;
  bool   target_water_l_set = 10;
  google.protobuf.Timestamp created_at = 11;
  repeated RecipeIngredient ingredients = 12;
  // Gin / botanical-bill fields. Optional for whisky-style recipes
  // (they stay at defaults / unset). See [[BotanicalRole]] and
  // [[DistillationMethod]] for the per-ingredient and per-version
  // structure.
  string tasting_notes = 13;
  DistillationMethod distillation_method = 14;
  double maceration_hours = 15;
  bool   maceration_hours_set = 16;
  double gin_ngs_input_l = 17;
  bool   gin_ngs_input_l_set = 18;
  double gin_ngs_input_abv_pct = 19;
  bool   gin_ngs_input_abv_pct_set = 20;
  GinSensoryScores sensory = 21;     // unset until first tasting (gin recipes)
  WhiskySensoryScores whisky_sensory = 22;  // unset until first tasting (whisky family)
}

// Per-version tasting bench scores, 0-10 on each axis. Field-level
// "_set" flags disambiguate "scored as 0" from "not tasted on this
// axis." All scores live in a child table (recipe_version_sensory) so
// editing a score doesn't churn the version's history.
message GinSensoryScores {
  int32 juniper = 1;  bool juniper_set = 2;
  int32 citrus  = 3;  bool citrus_set  = 4;
  int32 herbal  = 5;  bool herbal_set  = 6;
  int32 spice   = 7;  bool spice_set   = 8;
  int32 floral  = 9;  bool floral_set  = 10;
  int32 earth   = 11; bool earth_set   = 12;
  int32 body    = 13; bool body_set    = 14;
  int32 heat    = 15; bool heat_set    = 16;
  int32 balance = 17; bool balance_set = 18;
  int32 overall = 19; bool overall_set = 20;
  string tasting_panel = 21;            // "self", "Kyle + Jane", etc.
  google.protobuf.Timestamp tasted_at = 22;
}

message RecipeIngredient {
  string id = 1;
  string recipe_version_id = 2;
  string material_id = 3;
  string material_name = 4;            // denormalized for display
  MaterialKind material_kind = 5;
  double material_extract_pct = 6;     // 0 if not set
  bool   material_extract_pct_set = 7;
  double quantity = 8;
  string uom = 9;
  string notes = 10;
  int32  sort_order = 11;
  // Botanical role on a gin recipe — defaults to UNSPECIFIED for
  // non-botanical ingredients (grain, NGS, water).
  BotanicalRole botanical_role = 12;
}

// Projection breakdown produced from a RecipeVersion + a per-stage efficiency
// set. Wash volume/ABV are only populated when target_water_l is set.
message RecipeProjection {
  repeated RecipeProjectionLine lines = 1;
  double total_projected_laa = 2;
  double projected_wash_volume_l = 3;
  double projected_wash_abv_pct = 4;
}

message RecipeProjectionLine {
  string material_id = 1;
  string material_name = 2;
  double quantity = 3;
  string uom = 4;
  double fermentable_kg = 5;
  double extract_freed_kg = 6;
  double ethanol_mass_kg = 7;
  double ethanol_volume_l = 8;
  double projected_laa = 9;
}

// ---------------------------------------------------------------------------
// Requests / responses
// ---------------------------------------------------------------------------

message CreateRecipeRequest {
  string name = 1;
  SpiritKind spirit_kind = 2;
  string notes = 3;
}
message CreateRecipeResponse { Recipe recipe = 1; }

message ListRecipesRequest { bool include_archived = 1; }
message ListRecipesResponse { repeated Recipe recipes = 1; }

message GetRecipeRequest { string id = 1; }
message GetRecipeResponse {
  Recipe recipe = 1;
  RecipeVersion current_version = 2;     // unset if no version yet
  RecipeProjection projection = 3;       // computed from current_version
}

message ArchiveRecipeRequest { string id = 1; bool archived = 2; }
message ArchiveRecipeResponse { Recipe recipe = 1; }

message RecipeIngredientInput {
  string material_id = 1;
  double quantity = 2;
  string uom = 3;
  string notes = 4;
  int32  sort_order = 5;
  BotanicalRole botanical_role = 6;     // optional; gin recipes use it
}

message SaveRecipeVersionRequest {
  string recipe_id = 1;
  string notes = 2;
  double mash_efficiency_pct = 3;
  double ferment_efficiency_pct = 4;
  double distillation_recovery_pct = 5;
  double target_water_l = 6;
  bool   target_water_l_set = 7;
  repeated RecipeIngredientInput ingredients = 8;
  // Gin-specific. Whisky recipes leave these unset.
  string tasting_notes = 9;
  DistillationMethod distillation_method = 10;
  double maceration_hours = 11;
  bool   maceration_hours_set = 12;
  double gin_ngs_input_l = 13;
  bool   gin_ngs_input_l_set = 14;
  double gin_ngs_input_abv_pct = 15;
  bool   gin_ngs_input_abv_pct_set = 16;
}
message SaveRecipeVersionResponse {
  RecipeVersion version = 1;
  RecipeProjection projection = 2;
}

// Set / replace the per-version sensory scores. Upsert semantics — call
// this every time you taste, scores from the latest call win.
message SaveRecipeVersionSensoryRequest {
  string recipe_version_id = 1;
  GinSensoryScores scores = 2;
}
message SaveRecipeVersionSensoryResponse {
  GinSensoryScores scores = 1;
}

// Per-version whisky tasting scores. Axes are the 8 SWRI Flavour
// Wheel primary classes (cereal / estery / floral / peaty / feinty /
// sulphury / woody / winey — the canonical Scotch Whisky Research
// Institute vocabulary from the 1970s, taught in the IBD Diploma in
// Distilling Module 2 Lesson 6) plus body / finish / overall from the
// standard panel scorecard.
//
// All 0-10. `_set` flags disambiguate "scored zero" from "not tasted
// on this axis." Sulphury is primarily an off-note class — low score
// = clean spirit, high score = problem.
message WhiskySensoryScores {
  int32 cereal   = 1;  bool cereal_set   = 2;   // porridge / husky / malt / biscuit / cracker
  int32 estery   = 3;  bool estery_set   = 4;   // fruity esters: banana / pear-drop / apple / pineapple / citrus / dried fruit
  int32 floral   = 5;  bool floral_set   = 6;   // geranium / rose / fragrant / honey
  int32 peaty    = 7;  bool peaty_set    = 8;   // phenolic / smoky / medicinal / iodine / bonfire
  int32 feinty   = 9;  bool feinty_set   = 10;  // leather / tobacco / honey-tobacco / horse / cheesy
  int32 sulphury = 11; bool sulphury_set = 12;  // OFF-note class: rubbery / vegetative / sandy / gunflint / DMS
  int32 woody    = 13; bool woody_set    = 14;  // vanilla / toasted oak / resinous / coconut / sawdust
  int32 winey    = 15; bool winey_set    = 16;  // sherry / port / brandy notes (from finishing casks)
  int32 body     = 17; bool body_set     = 18;  // mouthfeel / weight / texture
  int32 finish   = 19; bool finish_set   = 20;  // length / persistence / dryness
  int32 overall  = 21; bool overall_set  = 22;  // gut-call quality / hedonic
  string tasting_panel = 23;
  google.protobuf.Timestamp tasted_at = 24;
}

message SaveRecipeVersionWhiskySensoryRequest {
  string recipe_version_id = 1;
  WhiskySensoryScores scores = 2;
}
message SaveRecipeVersionWhiskySensoryResponse {
  WhiskySensoryScores scores = 1;
}

message ListRecipeVersionsRequest { string recipe_id = 1; }
message ListRecipeVersionsResponse { repeated RecipeVersion versions = 1; }

message DuplicateRecipeRequest {
  string source_recipe_id = 1;
  string new_name = 2;
}
message DuplicateRecipeResponse { Recipe recipe = 1; }

service RecipeService {
  rpc CreateRecipe(CreateRecipeRequest) returns (CreateRecipeResponse);
  rpc DuplicateRecipe(DuplicateRecipeRequest) returns (DuplicateRecipeResponse);
  rpc ListRecipes(ListRecipesRequest) returns (ListRecipesResponse);
  rpc GetRecipe(GetRecipeRequest) returns (GetRecipeResponse);
  rpc ArchiveRecipe(ArchiveRecipeRequest) returns (ArchiveRecipeResponse);
  rpc SaveRecipeVersion(SaveRecipeVersionRequest) returns (SaveRecipeVersionResponse);
  rpc ListRecipeVersions(ListRecipeVersionsRequest) returns (ListRecipeVersionsResponse);
  rpc SaveRecipeVersionSensory(SaveRecipeVersionSensoryRequest) returns (SaveRecipeVersionSensoryResponse);
  rpc SaveRecipeVersionWhiskySensory(SaveRecipeVersionWhiskySensoryRequest) returns (SaveRecipeVersionWhiskySensoryResponse);
}
