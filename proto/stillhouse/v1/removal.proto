syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";

enum RemovalDestinationKind {
  REMOVAL_DESTINATION_KIND_UNSPECIFIED = 0;
  REMOVAL_DESTINATION_KIND_DUTY_PAID_CUSTOMER = 1;
  REMOVAL_DESTINATION_KIND_EXPORT = 2;
  REMOVAL_DESTINATION_KIND_SAMPLE = 3;
  REMOVAL_DESTINATION_KIND_DESTROYED = 4;
  REMOVAL_DESTINATION_KIND_TRANSFER_OUT_IN_BOND = 5;
  REMOVAL_DESTINATION_KIND_OTHER = 6;
}

message PackagingRemoval {
  string id = 1;
  string tenant_id = 2;
  int32  removal_no = 3;
  string packaged_inventory_id = 4;
  string product_name = 5;
  string lot_code = 6;
  string jurisdiction = 7;
  string removal_date = 8;
  int32  bottles_removed = 9;
  RemovalDestinationKind destination_kind = 10;
  string destination_name = 11;
  string reference = 12;
  // The buyer, when the removal named one. Removals recorded before
  // customers existed carry only destination_name, and are left that
  // way — pointing them at customers who did not exist when the
  // movement happened would be inventing records.
  string customer_id = 24;
  string customer_name = 25;
  int32  bottle_size_ml = 13;
  double bottle_abv_pct = 14;
  double total_litres = 15;
  double total_laa = 16;
  double duty_rate_per_laa = 17;
  double duty_amount_cad = 18;
  string notes = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp voided_at = 21;
  string voided_by = 22;
  string voided_reason = 23;
}

message CreateRemovalRequest {
  string packaged_inventory_id = 1;
  string removal_date = 2;             // ISO date; empty = today
  int32  bottles_removed = 3;
  // Either name a customer, or type a destination. Naming a customer
  // fills in the kind and the name from the customer record, so the
  // classification that drives the B266 line cannot drift from the
  // buyer it belongs to.
  string customer_id = 8;
  RemovalDestinationKind destination_kind = 4;
  string destination_name = 5;
  string reference = 6;
  string notes = 7;
}
message CreateRemovalResponse { PackagingRemoval removal = 1; }

message ListRemovalsRequest {
  string period_start = 1;
  string period_end = 2;
  int32  limit = 3;            // 0 = server default (100); max 500
  int32  offset = 4;
}
message ListRemovalsResponse {
  repeated PackagingRemoval removals = 1;
  int32 total_count = 2;
}

message VoidRemovalRequest {
  string id = 1;
  string reason = 2;
}
message VoidRemovalResponse { PackagingRemoval removal = 1; }

service RemovalService {
  rpc CreateRemoval(CreateRemovalRequest) returns (CreateRemovalResponse);
  rpc ListRemovals(ListRemovalsRequest) returns (ListRemovalsResponse);
  rpc VoidRemoval(VoidRemovalRequest) returns (VoidRemovalResponse);

  // Product coming back from the duty-paid market. It restocks and
  // credits; it does not relieve duty. See PackagedReturnCondition.
  rpc RecordPackagedReturn(RecordPackagedReturnRequest) returns (RecordPackagedReturnResponse);
  rpc ListPackagedReturns(ListPackagedReturnsRequest) returns (ListPackagedReturnsResponse);
  rpc VoidPackagedReturn(VoidPackagedReturnRequest) returns (VoidPackagedReturnResponse);

  // Consignment: our stock at somebody else's premises. Not a removal —
  // see ConsignmentStatus.
  rpc SendOnConsignment(SendOnConsignmentRequest) returns (SendOnConsignmentResponse);
  rpc SettleConsignment(SettleConsignmentRequest) returns (SettleConsignmentResponse);
  rpc ListConsignments(ListConsignmentsRequest) returns (ListConsignmentsResponse);
}

// Product coming back from the duty-paid market. PLAN D7.
//
// Spirits have no consignment regime the way small wine licensees do, but
// returns happen: damaged cases, delistings, over-ordering. What a return
// must never do is quietly undo duty. It crystallised when the goods were
// packaged or removed, and it does not un-crystallise because they came
// back — recovering it is a refund claim with a B256 behind it, which is
// PLAN A9 and is blocked on sourcing that form's rules.
//
// So a return here restocks, credits the customer, records that duty was
// paid and remains paid, and says outright that the refund is a separate
// claim Stillhouse cannot yet make.
enum PackagedReturnCondition {
  PACKAGED_RETURN_CONDITION_UNSPECIFIED = 0;
  // Back into stock: it can be sold again.
  PACKAGED_RETURN_CONDITION_SALEABLE = 1;
  // Came back but cannot be sold, so it does not restock. Whether its
  // destruction is relieved is the question EDM3-4-1 asks of any
  // destruction, and it is answered on the destruction, not here.
  PACKAGED_RETURN_CONDITION_UNSALEABLE = 2;
}

message PackagedReturn {
  string id = 1;
  int32  return_no = 2;
  string packaged_inventory_id = 3;
  string lot_code = 4;
  string product_name = 5;
  string customer_id = 6;
  string customer_name = 7;
  string removal_id = 8;
  int32  bottles = 9;
  PackagedReturnCondition condition = 10;
  string returned_on = 11;
  string reason = 12;
  double credit_amount_cad = 13;
  bool   credit_amount_set = 14;
  string credit_note_no = 15;
  double duty_paid_cad = 16;
  bool   duty_paid_set = 17;
  string notes = 18;
  bool   voided = 19;
  string void_reason = 20;
}

message RecordPackagedReturnRequest {
  string packaged_inventory_id = 1;
  string customer_id = 2;
  string removal_id = 3;
  int32  bottles = 4;
  PackagedReturnCondition condition = 5;
  string returned_on = 6;
  string reason = 7;
  double credit_amount_cad = 8;
  bool   credit_amount_set = 9;
  string credit_note_no = 10;
  string notes = 11;
}
message RecordPackagedReturnResponse {
  PackagedReturn packaged_return = 1;
  // Said on every response, not in the documentation: the operator
  // recording a return is the person who will otherwise assume the duty
  // came back with the bottles.
  string duty_note = 2;
}

message ListPackagedReturnsRequest { int32 limit = 1; }
message ListPackagedReturnsResponse { repeated PackagedReturn returns = 1; }

message VoidPackagedReturnRequest {
  string id = 1;
  string reason = 2;
}
message VoidPackagedReturnResponse { PackagedReturn packaged_return = 1; }

// Consignment: our stock, at somebody else's premises. PLAN D7.
//
// The excise question is the whole of it, and Stillhouse answers it
// explicitly rather than by omission: a consignment is NOT a removal. The
// stock stays on hand, marked as being at a customer, and a removal is
// recorded when it sells through.
//
// That is the ordinary accounting treatment and the safe one. At an
// at-packaging duty point duty crystallised already and consignment
// changes nothing; at an at-removal duty point, recording the removal
// later errs toward reporting duty late rather than never — and a return
// that reports duty a month late is a correctable mistake where one that
// never reports it is not.
//
// A licensee whose own arrangement treats the shipment itself as the
// removal records a removal when it ships and does not use this.
enum ConsignmentStatus {
  CONSIGNMENT_STATUS_UNSPECIFIED = 0;
  CONSIGNMENT_STATUS_OUT = 1;
  CONSIGNMENT_STATUS_SETTLED = 2;
  CONSIGNMENT_STATUS_RECALLED = 3;
}

message Consignment {
  string id = 1;
  int32  consignment_no = 2;
  string packaged_inventory_id = 3;
  string lot_code = 4;
  string product_name = 5;
  string customer_id = 6;
  string customer_name = 7;
  int32  bottles = 8;
  int32  bottles_settled = 9;
  int32  bottles_recalled = 10;
  // Still at the customer, unsold. The three always reconcile against
  // bottles.
  int32  bottles_out = 11;
  ConsignmentStatus status = 12;
  string sent_on = 13;
  string settled_on = 14;
  string notes = 15;
}

message SendOnConsignmentRequest {
  string packaged_inventory_id = 1;
  string customer_id = 2;
  int32  bottles = 3;
  string sent_on = 4;
  string notes = 5;
}
message SendOnConsignmentResponse {
  Consignment consignment = 1;
  // Said on every response, because an operator sending stock out will
  // otherwise assume it has been removed.
  string duty_note = 2;
}

message SettleConsignmentRequest {
  string id = 1;
  // Sold through. A removal is recorded for these, which is the point at
  // which they leave stock.
  int32  bottles_sold = 2;
  // Came back unsold. Not a return under stage 198 — a return is stock
  // that was sold and came back; this never sold.
  int32  bottles_recalled = 3;
  string on = 4;
}
message SettleConsignmentResponse { Consignment consignment = 1; }

message ListConsignmentsRequest { int32 limit = 1; }
message ListConsignmentsResponse {
  repeated Consignment consignments = 1;
  int32 open_consignments = 2;
  int32 bottles_out = 3;
}
