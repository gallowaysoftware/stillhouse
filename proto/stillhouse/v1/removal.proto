syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";

enum RemovalDestinationKind {
  REMOVAL_DESTINATION_KIND_UNSPECIFIED = 0;
  REMOVAL_DESTINATION_KIND_DUTY_PAID_CUSTOMER = 1;
  REMOVAL_DESTINATION_KIND_EXPORT = 2;
  REMOVAL_DESTINATION_KIND_SAMPLE = 3;
  REMOVAL_DESTINATION_KIND_DESTROYED = 4;
  REMOVAL_DESTINATION_KIND_TRANSFER_OUT_IN_BOND = 5;
  REMOVAL_DESTINATION_KIND_OTHER = 6;
}

message PackagingRemoval {
  string id = 1;
  string tenant_id = 2;
  int32  removal_no = 3;
  string packaged_inventory_id = 4;
  string product_name = 5;
  string lot_code = 6;
  string jurisdiction = 7;
  string removal_date = 8;
  int32  bottles_removed = 9;
  RemovalDestinationKind destination_kind = 10;
  string destination_name = 11;
  string reference = 12;
  int32  bottle_size_ml = 13;
  double bottle_abv_pct = 14;
  double total_litres = 15;
  double total_laa = 16;
  double duty_rate_per_laa = 17;
  double duty_amount_cad = 18;
  string notes = 19;
  google.protobuf.Timestamp created_at = 20;
}

message CreateRemovalRequest {
  string packaged_inventory_id = 1;
  string removal_date = 2;             // ISO date; empty = today
  int32  bottles_removed = 3;
  RemovalDestinationKind destination_kind = 4;
  string destination_name = 5;
  string reference = 6;
  string notes = 7;
}
message CreateRemovalResponse { PackagingRemoval removal = 1; }

message ListRemovalsRequest {
  string period_start = 1;
  string period_end = 2;
}
message ListRemovalsResponse { repeated PackagingRemoval removals = 1; }

service RemovalService {
  rpc CreateRemoval(CreateRemovalRequest) returns (CreateRemovalResponse);
  rpc ListRemovals(ListRemovalsRequest) returns (ListRemovalsResponse);
}
