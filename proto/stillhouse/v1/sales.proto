// The order, the pick and the removal it becomes.
//
// Removals were recorded by hand: somebody shipped a pallet, and later
// somebody else remembered to type a removal against the right lot. The
// two acts had nothing to do with each other, so a shipment that never
// got typed was a quiet under-report on the return, and a removal typed
// against the wrong lot moved duty between jurisdictions with nothing to
// catch it.
//
// Here a shipment produces the removals. Marking one shipped writes them
// in the same transaction, against the lots that were actually picked —
// what left the building and what the return says left are the same rows
// read twice.
syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";
import "stillhouse/v1/removal.proto";

enum SalesOrderStatus {
  SALES_ORDER_STATUS_UNSPECIFIED = 0;
  SALES_ORDER_STATUS_DRAFT = 1;
  SALES_ORDER_STATUS_CONFIRMED = 2;
  SALES_ORDER_STATUS_PARTIALLY_SHIPPED = 3;
  SALES_ORDER_STATUS_SHIPPED = 4;
  SALES_ORDER_STATUS_CLOSED = 5;
  SALES_ORDER_STATUS_CANCELLED = 6;
}

message SalesOrderLine {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  int32  bottle_size_ml = 4;
  double bottle_abv_pct = 5;
  int32  bottles_ordered = 6;
  // What has actually left, accumulated from shipments. The difference
  // is what is still owed — and what the stock screen calls spoken for.
  int32  bottles_shipped = 7;
  // Per bottle, in CAD. A decimal string: it is money on a document.
  string unit_price = 8;
  string notes = 9;
}

message SalesOrder {
  string id = 1;
  int32  order_no = 2;
  string customer_id = 3;
  string customer_name = 4;
  SalesOrderStatus status = 5;
  string ordered_on = 6;   // ISO date
  string required_by = 7;  // ISO date; empty = none given
  string customer_reference = 8;
  string price_list_id = 9;
  string location_id = 10;
  string notes = 11;
  string cancel_reason = 12;
  repeated SalesOrderLine lines = 13;
  // Sum of bottles × unit price across the lines, as a decimal string.
  string total_value = 14;
  int32  bottles_ordered = 15;
  int32  bottles_shipped = 16;
  google.protobuf.Timestamp confirmed_at = 17;
  google.protobuf.Timestamp created_at = 18;
}

message CreateSalesOrderRequest {
  string customer_id = 1;
  string ordered_on = 2;   // ISO date; empty = today
  string required_by = 3;
  string customer_reference = 4;
  string price_list_id = 5;
  string location_id = 6;
  string notes = 7;
}
message CreateSalesOrderResponse { SalesOrder sales_order = 1; }

message AddSalesOrderLineRequest {
  string sales_order_id = 1;
  string product_id = 2;
  int32  bottles_ordered = 3;
  // Empty looks the price up on the order's price list, and falls back to
  // the product's list price when no list applies. An explicit figure
  // wins — a hand-agreed price is a fact, not a mistake to correct.
  string unit_price = 4;
  string notes = 5;
}
message AddSalesOrderLineResponse { SalesOrder sales_order = 1; }

message RemoveSalesOrderLineRequest { string line_id = 1; }
message RemoveSalesOrderLineResponse { SalesOrder sales_order = 1; }

message SetSalesOrderStatusRequest {
  string id = 1;
  SalesOrderStatus status = 2;
  string cancel_reason = 3;
}
message SetSalesOrderStatusResponse { SalesOrder sales_order = 1; }

message ListSalesOrdersRequest {
  // Only what is still owed: draft, confirmed, partially shipped.
  bool open_only = 1;
}
message ListSalesOrdersResponse { repeated SalesOrder sales_orders = 1; }

message GetSalesOrderRequest { string id = 1; }
message GetSalesOrderResponse {
  SalesOrder sales_order = 1;
  repeated Shipment shipments = 2;
}

// ----- shipments -----------------------------------------------------------

enum ShipmentStatus {
  SHIPMENT_STATUS_UNSPECIFIED = 0;
  SHIPMENT_STATUS_PICKING = 1;
  SHIPMENT_STATUS_SHIPPED = 2;
  SHIPMENT_STATUS_CANCELLED = 3;
}

message ShipmentLine {
  string id = 1;
  string sales_order_line_id = 2;
  // The lot, not the product. A removal is against a lot — that is what
  // carries the jurisdiction, the stamps and the duty basis — so the pick
  // has to name one.
  string packaged_inventory_id = 3;
  string lot_code = 4;
  string jurisdiction = 5;
  string product_name = 6;
  int32  bottle_size_ml = 7;
  double bottle_abv_pct = 8;
  int32  bottles = 9;
  int32  bottles_on_hand = 10;
  bool   released = 11;
  bool   on_hold = 12;
  // Set once the shipment ships: the removal this line became.
  string packaging_removal_id = 13;
  int32  removal_no = 14;
  string notes = 15;
}

message Shipment {
  string id = 1;
  int32  shipment_no = 2;
  string sales_order_id = 3;
  int32  order_no = 4;
  string customer_id = 5;
  string customer_name = 6;
  // Copied onto the shipment for the packing slip. A slip that names the
  // consignee and the licence they hold is the document that travels with
  // the pallet; making the operator look it up somewhere else is how it
  // ends up wrong.
  string customer_address = 21;
  string customer_licence_number = 22;
  string customer_jurisdiction = 23;
  ShipmentStatus status = 7;
  string location_id = 8;
  string ship_date = 9;  // ISO date
  string carrier = 10;
  string tracking_ref = 11;
  string bol_reference = 12;
  string notes = 13;
  string cancel_reason = 14;
  repeated ShipmentLine lines = 15;
  int32  bottles = 16;
  // Totals across the lines, so a picker can see what they are about to
  // put on the return before they commit to it.
  double total_litres = 17;
  double total_laa = 18;
  google.protobuf.Timestamp shipped_at = 19;
  google.protobuf.Timestamp created_at = 20;
}

message CreateShipmentRequest {
  // Optional. A shipment with no order behind it is legitimate — a
  // sample, a donation, a licensee collecting in person — and still has
  // to produce a removal.
  string sales_order_id = 1;
  // Required when there is no order; taken from the order otherwise.
  string customer_id = 2;
  string location_id = 3;
  string ship_date = 4;  // ISO date; empty = when it ships
  string carrier = 5;
  string tracking_ref = 6;
  string bol_reference = 7;
  string notes = 8;
}
message CreateShipmentResponse { Shipment shipment = 1; }

message AddShipmentLineRequest {
  string shipment_id = 1;
  string packaged_inventory_id = 2;
  int32  bottles = 3;
  // Optional: which order line this pick satisfies. Set it and the order
  // closes itself out as the stock leaves.
  string sales_order_line_id = 4;
  string notes = 5;
}
message AddShipmentLineResponse { Shipment shipment = 1; }

message RemoveShipmentLineRequest { string line_id = 1; }
message RemoveShipmentLineResponse { Shipment shipment = 1; }

message ShipShipmentRequest {
  string id = 1;
  // ISO date; empty uses the shipment's ship_date, then today. This is
  // the date the removals carry, so it is the date the duty rate is
  // read at.
  string ship_date = 2;
  string reference = 3;
}
message ShipShipmentResponse {
  Shipment shipment = 1;
  // The removals this shipment just wrote. Returned so the operator sees
  // the compliance consequence of the act at the moment they commit it,
  // not a month later on a return.
  repeated PackagingRemoval removals = 2;
  // Duty crystallised by this shipment, in CAD. Zero when the stock was
  // dutied at packaging — which is a fact about the duty point, not an
  // omission.
  double duty_cad = 3;
}

message CancelShipmentRequest {
  string id = 1;
  string reason = 2;
}
message CancelShipmentResponse { Shipment shipment = 1; }

message ListShipmentsRequest {
  // Only what is still being picked.
  bool open_only = 1;
}
message ListShipmentsResponse { repeated Shipment shipments = 1; }

message GetShipmentRequest { string id = 1; }
message GetShipmentResponse { Shipment shipment = 1; }

// ----- what is spoken for --------------------------------------------------

message StockCommitment {
  string product_id = 1;
  string product_name = 2;
  int32  bottle_size_ml = 3;
  double bottle_abv_pct = 4;
  int32  bottles_on_hand = 5;
  // Owed on confirmed orders that have not shipped.
  int32  bottles_reserved = 6;
  // Already on a shipment that is still being picked.
  int32  bottles_picked = 7;
  // On hand less picked. Reservations are advisory and do not reduce it —
  // an order is a promise, and promises do not move alcohol.
  int32  bottles_available = 8;
  // True when what is promised exceeds what exists. Worth saying out loud
  // before somebody drives to a customer with half a load.
  bool   oversold = 9;
}

message ListStockCommitmentsRequest {}
message ListStockCommitmentsResponse { repeated StockCommitment commitments = 1; }

service SalesService {
  rpc CreateSalesOrder(CreateSalesOrderRequest) returns (CreateSalesOrderResponse);
  rpc AddSalesOrderLine(AddSalesOrderLineRequest) returns (AddSalesOrderLineResponse);
  rpc RemoveSalesOrderLine(RemoveSalesOrderLineRequest) returns (RemoveSalesOrderLineResponse);
  rpc SetSalesOrderStatus(SetSalesOrderStatusRequest) returns (SetSalesOrderStatusResponse);
  rpc ListSalesOrders(ListSalesOrdersRequest) returns (ListSalesOrdersResponse);
  rpc GetSalesOrder(GetSalesOrderRequest) returns (GetSalesOrderResponse);

  rpc CreateShipment(CreateShipmentRequest) returns (CreateShipmentResponse);
  rpc AddShipmentLine(AddShipmentLineRequest) returns (AddShipmentLineResponse);
  rpc RemoveShipmentLine(RemoveShipmentLineRequest) returns (RemoveShipmentLineResponse);
  rpc ShipShipment(ShipShipmentRequest) returns (ShipShipmentResponse);
  rpc CancelShipment(CancelShipmentRequest) returns (CancelShipmentResponse);
  rpc ListShipments(ListShipmentsRequest) returns (ListShipmentsResponse);
  rpc GetShipment(GetShipmentRequest) returns (GetShipmentResponse);

  rpc ListStockCommitments(ListStockCommitmentsRequest) returns (ListStockCommitmentsResponse);
}
