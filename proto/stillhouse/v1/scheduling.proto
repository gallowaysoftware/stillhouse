// What needs making, and whether the plant can make it.
//
// Driven by actual demand — confirmed, unshipped order lines — rather
// than by a forecast. Stillhouse has no forecast, and a plan built on an
// invented one looks exactly as authoritative as a plan built on orders.
// PLAN F7 is where a forecast would go; until it exists this says what it
// is working from, on the page, every time.
//
// The other half of honesty here is the plant. A piece of equipment with
// no recorded capacity or no recorded run time cannot be planned against,
// and is returned with the reason rather than dropped — an empty schedule
// and a schedule that silently omitted half the still house look
// identical from the outside.
syntax = "proto3";

package stillhouse.v1;

import "stillhouse/v1/equipment.proto";

message DemandLine {
  string product_id = 1;
  string product_name = 2;
  int32  bottle_size_ml = 3;
  double bottle_abv_pct = 4;
  // Confirmed and unshipped. A real commitment, not a projection.
  int32  bottles_owed = 5;
  string earliest_required = 6;   // ISO date; empty if no order gave one
  // Ours, here, released and not already picked onto an open shipment.
  int32  bottles_on_hand = 7;
  int32  bottles_picked = 8;
  int32  bottles_available = 9;
  // What is missing. Zero when stock covers the orders.
  int32  shortfall = 10;
  // The alcohol that shortfall would need, so it can be compared against
  // what is actually in the tanks.
  double shortfall_laa = 11;
  // True when the earliest required date has already passed and the
  // stock is not there.
  bool   late = 12;
}

message PlannableEquipment {
  string id = 1;
  string name = 2;
  EquipmentKind kind = 3;
  EquipmentStatus status = 4;
  double capacity_l = 5;
  bool   capacity_l_set = 6;
  // Observed from work orders that recorded a start and a finish; the
  // median, so one run left going over a weekend does not move it.
  double observed_median_hours = 7;
  int32  observed_runs = 8;
  double typical_run_hours = 9;
  bool   typical_run_hours_set = 10;
  // Whether this can be planned against at all, and why not.
  bool   plannable = 11;
  string why_not = 12;
  // Work already on the board in the window.
  repeated ScheduledWork scheduled = 13;
  // Hours the scheduled work is expected to take, from the observed
  // median where there is one and the recorded typical run otherwise.
  double scheduled_hours = 14;
}

message ScheduledWork {
  string work_order_id = 1;
  int32  work_order_no = 2;
  string title = 3;
  string scheduled_for = 4;   // ISO date
  string due_on = 5;
  string status = 6;
}

message ProductionPlanRequest {
  // The window the board covers. Empty defaults to the next four weeks.
  string from = 1;            // ISO date
  string to = 2;              // ISO date
}
message ProductionPlanResponse {
  repeated DemandLine demand = 1;
  repeated PlannableEquipment equipment = 2;
  string from = 3;
  string to = 4;

  // Total alcohol the shortfalls need, and what is actually available to
  // bottle: ours, here, and not in somebody else's cask.
  double shortfall_laa = 5;
  double available_laa = 6;
  // True when the shortfalls need more alcohol than there is. The one
  // number worth putting in front of somebody before they promise a date.
  bool   short_of_alcohol = 7;

  // What this plan is working from, said on the page. Never empty.
  string basis = 8;
  // Things the plan could not take into account — plant with no capacity
  // recorded, orders with no required-by date. Named rather than dropped.
  repeated string blind_spots = 9;
}

service SchedulingService {
  rpc ProductionPlan(ProductionPlanRequest) returns (ProductionPlanResponse);

  // Projected demand, reported beside the committed orders above and
  // never added to them. See ForecastMethod.
  rpc DemandForecast(DemandForecastRequest) returns (DemandForecastResponse);
  rpc SetForecastMethod(SetForecastMethodRequest) returns (SetForecastMethodResponse);
  rpc SaveDemandForecast(SaveDemandForecastRequest) returns (SaveDemandForecastResponse);
  // Which recipe a product is planned from. Unset refuses rather than
  // being inferred from the last run that made it — that would be right
  // most of the time and wrong exactly when a recipe has changed, which
  // is when somebody is most likely to be planning.
  rpc SetProductRecipe(SetProductRecipeRequest) returns (SetProductRecipeResponse);
  rpc SetRecipeMashEquipment(SetRecipeMashEquipmentRequest) returns (SetRecipeMashEquipmentResponse);
}

// Demand forecasting. PLAN F7.
//
// Stage 185 built the production plan from ACTUAL demand — confirmed,
// unshipped order lines — and says so on the page every time, because a
// plan built on an invented forecast looks exactly as authoritative as
// one built on orders. That is the constraint on everything below.
//
// A forecast is therefore reported BESIDE the orders and never added to
// them. A single number combining twelve bottles somebody has paid for
// with forty somebody might buy is worse than no forecast at all, because
// nobody can take it apart again.
enum ForecastMethod {
  FORECAST_METHOD_UNSPECIFIED = 0;
  // Mean of the last N complete months of duty-paid removals. Good where
  // sales are steady, wrong where they are seasonal.
  FORECAST_METHOD_TRAILING_AVERAGE = 1;
  // The same month last year. Good where sales are seasonal, wrong in a
  // first year and wrong after a step change.
  FORECAST_METHOD_SAME_PERIOD_LAST_YEAR = 2;
  // The operator's own numbers — the only method that can be right when
  // there is a listing decision or a festival in the diary.
  FORECAST_METHOD_MANUAL = 3;
}

message ForecastLine {
  string product_id = 1;
  string product_name = 2;
  // Committed: confirmed and unshipped order lines. The same figure the
  // production plan uses, repeated here so the two can be compared
  // without being combined.
  int32  bottles_committed = 3;
  // Projected. Zero and unavailable are different: see available.
  int32  bottles_forecast = 4;
  bool   available = 5;
  // Why there is no figure, when there is none. A product nobody has
  // sold and a product forecast to sell nothing are different claims.
  string missing = 6;
  // The working, so the number can be argued with rather than believed.
  string basis = 7;
  int32  months_used = 8;
  // True when an operator replaced the computed figure by hand.
  bool   overridden = 9;
  string override_reason = 10;
  int32  bottles_on_hand = 11;

  // What the forecast implies has to be made, and bought to make it.
  //
  // The two halves fail independently and for different reasons: the
  // alcohol figure needs only this product's own size and strength, while
  // the materials need a recipe somebody has linked. Reporting them as
  // one availability would hide a usable answer behind a missing one.
  int32  bottles_to_make = 12;
  double laa_needed = 13;
  bool   materials_available = 14;
  string materials_missing = 15;
  // How many of the recipe's own batches this comes to. Reported because
  // it is the number an operator reasons in, and because it makes the
  // linear-scaling assumption visible: 2.4 batches is three mashes, and
  // no arithmetic here can decide that for them.
  double batches = 16;
  repeated MaterialRequirement materials = 17;
  string recipe_name = 18;

  // Batches rounded up to whole mashes of the vessel the recipe states.
  // A batch count is arithmetic; a mash count is a fact about the plant,
  // and an unstated vessel refuses rather than assuming one.
  int32  mashes = 19;
  bool   mashes_available = 20;
  string mashes_missing = 21;
  string mash_vessel = 22;

  // When the materials have to be ordered, counting back from the start
  // of the period by the longest lead time on the bill — an order arrives
  // when its slowest line does.
  string order_by = 23;
  bool   order_by_available = 24;
  string order_by_missing = 25;
}

message MaterialRequirement {
  string material = 1;
  double quantity = 2;
  string uom = 3;
}

message DemandForecastRequest {
  // The month to project, ISO date; any day in it. Empty means next
  // month.
  string month = 1;
}
message DemandForecastResponse {
  repeated ForecastLine lines = 1;
  ForecastMethod method = 2;
  int32 trailing_months = 3;
  string period_start = 4;
  string period_end = 5;
  // Set when no method has been chosen. Everything above is empty then.
  string refused = 6;
  // Said on the response, not in the documentation.
  string caution = 7;

  // Alcohol that could be bottled next month, and alcohol that could not
  // because it is still in wood. Kept apart on purpose: adding a
  // maturing cask to the free figure would say a shortfall is covered
  // when it is not.
  double free_laa = 8;
  double maturing_laa = 9;
  // The sum of laa_needed across the lines above, so the shortfall can be
  // read without adding a column up by hand.
  double total_laa_needed = 10;
}

message SetForecastMethodRequest {
  ForecastMethod method = 1;
  int32 trailing_months = 2;
}
message SetForecastMethodResponse {
  ForecastMethod method = 1;
  int32 trailing_months = 2;
}

message SaveDemandForecastRequest {
  string product_id = 1;
  string month = 2;
  int32  bottles = 3;
  string reason = 4;
}
message SaveDemandForecastResponse {}

message SetProductRecipeRequest {
  string product_id = 1;
  // Empty clears it, which puts material requirements back to refusing
  // rather than leaving a stale recipe planning next month's grain.
  string recipe_version_id = 2;
}
message SetProductRecipeResponse {}

message SetRecipeMashEquipmentRequest {
  string recipe_version_id = 1;
  // Empty clears it, putting the mash count back to refusing rather than
  // leaving a vessel that is no longer used planning the work.
  string equipment_id = 2;
}
message SetRecipeMashEquipmentResponse {}
