// Tenant: one Stillhouse tenant = one distillery operating under a single
// CRA spirits licence (Excise Act, 2001).
syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";

// DutyPoint is the event at which excise duty becomes payable.
//
// It is derived from whether the tenant holds an excise warehouse licence,
// not chosen: a spirits licensee without one cannot possess non-duty-paid
// packaged spirits at all (EDM3-1-1 para 18), so duty becomes payable when
// the spirits are packaged (para 29). A licensee holding a warehouse
// licence may hold packaged spirits non-duty-paid and pays on removal to
// the duty-paid market.
enum DutyPoint {
  DUTY_POINT_UNSPECIFIED = 0;
  // No excise warehouse licence: duty is payable at bottling.
  DUTY_POINT_AT_PACKAGING = 1;
  // Excise warehouse licence held: duty is payable at removal.
  DUTY_POINT_AT_REMOVAL = 2;
}

// How often the licensee files. An authorized licensee may file
// semi-annually (form B284) rather than monthly — EDM3-1-1 ¶50.
enum FilingFrequency {
  FILING_FREQUENCY_UNSPECIFIED = 0;
  FILING_FREQUENCY_MONTHLY = 1;
  FILING_FREQUENCY_SEMI_ANNUAL = 2;
}

// How the licensee's fiscal months are defined. Set by notification (form
// B268) rather than assumed.
enum FiscalMonthBasis {
  FISCAL_MONTH_BASIS_UNSPECIFIED = 0;
  FISCAL_MONTH_BASIS_CALENDAR_MONTH = 1;
  // Fiscal months end on a nominated day, so one runs from the 26th to the
  // 25th. Between 1 and 28 — a fiscal month ending on the 30th has no
  // February.
  FISCAL_MONTH_BASIS_FIXED_DAY_OF_MONTH = 2;
}

message Tenant {
  string id = 1;                                // UUID
  string name = 2;
  string cra_spirits_licence_number = 3;
  string excise_warehouse_licence_number = 4;   // optional; only required if the tenant holds one
  string default_jurisdiction = 5;              // ISO 3166-2 subdivision (e.g., "CA-ON")
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;

  // Derived from excise_warehouse_licence_number; read-only. Setting or
  // clearing the licence number moves it.
  DutyPoint duty_point = 8;
  // First day duty_point governs, ISO date. Duty events before it used the
  // at-removal basis, which is what has already been filed — nothing filed
  // moves when the duty point changes.
  string duty_point_effective_from = 9;

  // The reporting calendar. Neither election is something a licensee just
  // decides — each is filed with CRA — so the reference sits beside the
  // setting.
  FilingFrequency filing_frequency = 10;
  FiscalMonthBasis fiscal_month_basis = 11;
  int32 fiscal_month_end_day = 12;
  string fiscal_month_notification_ref = 13;
  string filing_frequency_authorization_ref = 14;
}

message CreateTenantRequest {
  string name = 1;
  string cra_spirits_licence_number = 2;
  string default_jurisdiction = 3;
  // Bootstrap owner account, created in the same transaction.
  string owner_email = 4;
  string owner_password = 5;
  string owner_display_name = 6;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message GetTenantRequest {}

message GetTenantResponse {
  Tenant tenant = 1;
}

message UpdateFilingCalendarRequest {
  FilingFrequency filing_frequency = 1;
  FiscalMonthBasis fiscal_month_basis = 2;
  int32 fiscal_month_end_day = 3;          // required for FIXED_DAY_OF_MONTH
  string fiscal_month_notification_ref = 4;
  string filing_frequency_authorization_ref = 5;
}
message UpdateFilingCalendarResponse { Tenant tenant = 1; }

message UpdateTenantRequest {
  string name = 1;
  string cra_spirits_licence_number = 2;
  string excise_warehouse_licence_number = 3;   // empty = clear
  string default_jurisdiction = 4;
}
message UpdateTenantResponse { Tenant tenant = 1; }

// DeleteMyTenant — owner-only, hard-deletes the caller's tenant and every
// row that cascades from it (users, recipes, mashes, ferments, distillations,
// barrels, bulk, bottling, removals, B266 history, audit_events, invite
// codes redeemed by this tenant, etc). Irreversible.
//
// Caller must retype the tenant name as a confirmation, mirroring the
// GitHub / Stripe pattern for destructive account actions.
message DeleteMyTenantRequest {
  string confirm_name = 1;
}
message DeleteMyTenantResponse {}

// TenantService manages tenant metadata.
// CreateTenant is the bootstrap operation for a fresh self-hosted install.
// ----- licence register ----------------------------------------------------

// What the licensee actually holds. Which returns exist is a function of
// which licences are held; so is where the duty point falls, and so is
// what renewal reminders are possible at all.
enum ExciseLicenceKind {
  EXCISE_LICENCE_KIND_UNSPECIFIED = 0;
  EXCISE_LICENCE_KIND_SPIRITS = 1;           // L63A — produce or package spirits
  EXCISE_LICENCE_KIND_EXCISE_WAREHOUSE = 2;  // L63W — store non-duty-paid spirits
  EXCISE_LICENCE_KIND_USERS = 3;             // use spirits in manufacture
  EXCISE_LICENCE_KIND_WINE = 4;
  EXCISE_LICENCE_KIND_OTHER = 5;
}

message ExciseLicence {
  string id = 1;
  ExciseLicenceKind kind = 2;
  string licence_number = 3;
  string effective_from = 4;  // ISO date
  // ISO date, or empty when nobody has recorded it. Empty raises no
  // renewal reminder: every CRA licence expires, so a missing date means
  // it is unknown, and a reminder for a guessed day gets believed.
  string expires_on = 5;
  string premises = 6;
  // Security posted under s.23. A decimal string, because it is money.
  string security_amount_cad = 7;
  string security_expires_on = 8;
  string notes = 9;
  // Surrendered or revoked. The row is kept, not deleted: a return filed
  // under a licence that no longer exists still has to be explicable.
  string ceased_on = 10;
}

message ListExciseLicencesRequest {}
message ListExciseLicencesResponse {
  repeated ExciseLicence licences = 1;
  // Live licences with no expiry recorded, so the screen can say the
  // register is incomplete rather than looking finished.
  int32 missing_expiry_count = 2;
}

message SaveExciseLicenceRequest {
  // Empty id creates; otherwise updates that licence.
  string id = 1;
  ExciseLicenceKind kind = 2;
  string licence_number = 3;
  string effective_from = 4;
  string expires_on = 5;
  string premises = 6;
  string security_amount_cad = 7;
  string security_expires_on = 8;
  string notes = 9;
  string ceased_on = 10;
}
message SaveExciseLicenceResponse { ExciseLicence licence = 1; }

service TenantService {
  rpc ListExciseLicences(ListExciseLicencesRequest) returns (ListExciseLicencesResponse);
  rpc SaveExciseLicence(SaveExciseLicenceRequest) returns (SaveExciseLicenceResponse);
  rpc UpdateFilingCalendar(UpdateFilingCalendarRequest) returns (UpdateFilingCalendarResponse);
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  rpc DeleteMyTenant(DeleteMyTenantRequest) returns (DeleteMyTenantResponse);
}
