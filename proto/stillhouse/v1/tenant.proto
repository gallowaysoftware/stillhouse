// Tenant: one Stillhouse tenant = one distillery operating under a single
// CRA spirits licence (Excise Act, 2001).
syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";

// DutyPoint is the event at which excise duty becomes payable.
//
// It is derived from whether the tenant holds an excise warehouse licence,
// not chosen: a spirits licensee without one cannot possess non-duty-paid
// packaged spirits at all (EDM3-1-1 para 18), so duty becomes payable when
// the spirits are packaged (para 29). A licensee holding a warehouse
// licence may hold packaged spirits non-duty-paid and pays on removal to
// the duty-paid market.
enum DutyPoint {
  DUTY_POINT_UNSPECIFIED = 0;
  // No excise warehouse licence: duty is payable at bottling.
  DUTY_POINT_AT_PACKAGING = 1;
  // Excise warehouse licence held: duty is payable at removal.
  DUTY_POINT_AT_REMOVAL = 2;
}

message Tenant {
  string id = 1;                                // UUID
  string name = 2;
  string cra_spirits_licence_number = 3;
  string excise_warehouse_licence_number = 4;   // optional; only required if the tenant holds one
  string default_jurisdiction = 5;              // ISO 3166-2 subdivision (e.g., "CA-ON")
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;

  // Derived from excise_warehouse_licence_number; read-only. Setting or
  // clearing the licence number moves it.
  DutyPoint duty_point = 8;
  // First day duty_point governs, ISO date. Duty events before it used the
  // at-removal basis, which is what has already been filed — nothing filed
  // moves when the duty point changes.
  string duty_point_effective_from = 9;
}

message CreateTenantRequest {
  string name = 1;
  string cra_spirits_licence_number = 2;
  string default_jurisdiction = 3;
  // Bootstrap owner account, created in the same transaction.
  string owner_email = 4;
  string owner_password = 5;
  string owner_display_name = 6;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message GetTenantRequest {}

message GetTenantResponse {
  Tenant tenant = 1;
}

message UpdateTenantRequest {
  string name = 1;
  string cra_spirits_licence_number = 2;
  string excise_warehouse_licence_number = 3;   // empty = clear
  string default_jurisdiction = 4;
}
message UpdateTenantResponse { Tenant tenant = 1; }

// DeleteMyTenant — owner-only, hard-deletes the caller's tenant and every
// row that cascades from it (users, recipes, mashes, ferments, distillations,
// barrels, bulk, bottling, removals, B266 history, audit_events, invite
// codes redeemed by this tenant, etc). Irreversible.
//
// Caller must retype the tenant name as a confirmation, mirroring the
// GitHub / Stripe pattern for destructive account actions.
message DeleteMyTenantRequest {
  string confirm_name = 1;
}
message DeleteMyTenantResponse {}

// TenantService manages tenant metadata.
// CreateTenant is the bootstrap operation for a fresh self-hosted install.
service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  rpc DeleteMyTenant(DeleteMyTenantRequest) returns (DeleteMyTenantResponse);
}
