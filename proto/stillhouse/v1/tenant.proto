// Tenant: one Stillhouse tenant = one distillery operating under a single
// CRA spirits licence (Excise Act, 2001).
syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";

// DutyPoint is the event at which excise duty becomes payable.
//
// It is derived from whether the tenant holds an excise warehouse licence,
// not chosen: a spirits licensee without one cannot possess non-duty-paid
// packaged spirits at all (EDM3-1-1 para 18), so duty becomes payable when
// the spirits are packaged (para 29). A licensee holding a warehouse
// licence may hold packaged spirits non-duty-paid and pays on removal to
// the duty-paid market.
enum DutyPoint {
  DUTY_POINT_UNSPECIFIED = 0;
  // No excise warehouse licence: duty is payable at bottling.
  DUTY_POINT_AT_PACKAGING = 1;
  // Excise warehouse licence held: duty is payable at removal.
  DUTY_POINT_AT_REMOVAL = 2;
}

// How often the licensee files. An authorized licensee may file
// semi-annually (form B284) rather than monthly — EDM3-1-1 ¶50.
enum FilingFrequency {
  FILING_FREQUENCY_UNSPECIFIED = 0;
  FILING_FREQUENCY_MONTHLY = 1;
  FILING_FREQUENCY_SEMI_ANNUAL = 2;
}

// How the licensee's fiscal months are defined. Set by notification (form
// B268) rather than assumed.
enum FiscalMonthBasis {
  FISCAL_MONTH_BASIS_UNSPECIFIED = 0;
  FISCAL_MONTH_BASIS_CALENDAR_MONTH = 1;
  // Fiscal months end on a nominated day, so one runs from the 26th to the
  // 25th. Between 1 and 28 — a fiscal month ending on the 30th has no
  // February.
  FISCAL_MONTH_BASIS_FIXED_DAY_OF_MONTH = 2;
}

message Tenant {
  string id = 1;                                // UUID
  string name = 2;
  string cra_spirits_licence_number = 3;
  string excise_warehouse_licence_number = 4;   // optional; only required if the tenant holds one
  string default_jurisdiction = 5;              // ISO 3166-2 subdivision (e.g., "CA-ON")
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;

  // Derived from excise_warehouse_licence_number; read-only. Setting or
  // clearing the licence number moves it.
  DutyPoint duty_point = 8;
  // First day duty_point governs, ISO date. Duty events before it used the
  // at-removal basis, which is what has already been filed — nothing filed
  // moves when the duty point changes.
  string duty_point_effective_from = 9;

  // The reporting calendar. Neither election is something a licensee just
  // decides — each is filed with CRA — so the reference sits beside the
  // setting.
  FilingFrequency filing_frequency = 10;
  FiscalMonthBasis fiscal_month_basis = 11;
  int32 fiscal_month_end_day = 12;
  string fiscal_month_notification_ref = 13;
  string filing_frequency_authorization_ref = 14;
  // Whether a packaged lot must be released for sale before it can be
  // removed. See SetBatchReleaseRequired.
  bool require_batch_release = 15;
}

message CreateTenantRequest {
  string name = 1;
  string cra_spirits_licence_number = 2;
  string default_jurisdiction = 3;
  // Bootstrap owner account, created in the same transaction.
  string owner_email = 4;
  string owner_password = 5;
  string owner_display_name = 6;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message GetTenantRequest {}

message GetTenantResponse {
  Tenant tenant = 1;
}

message UpdateFilingCalendarRequest {
  FilingFrequency filing_frequency = 1;
  FiscalMonthBasis fiscal_month_basis = 2;
  int32 fiscal_month_end_day = 3;          // required for FIXED_DAY_OF_MONTH
  string fiscal_month_notification_ref = 4;
  string filing_frequency_authorization_ref = 5;
}
message UpdateFilingCalendarResponse { Tenant tenant = 1; }

message UpdateTenantRequest {
  string name = 1;
  string cra_spirits_licence_number = 2;
  string excise_warehouse_licence_number = 3;   // empty = clear
  string default_jurisdiction = 4;
}
message UpdateTenantResponse { Tenant tenant = 1; }

// DeleteMyTenant — owner-only, hard-deletes the caller's tenant and every
// row that cascades from it (users, recipes, mashes, ferments, distillations,
// barrels, bulk, bottling, removals, B266 history, audit_events, invite
// codes redeemed by this tenant, etc). Irreversible.
//
// Caller must retype the tenant name as a confirmation, mirroring the
// GitHub / Stripe pattern for destructive account actions.
message DeleteMyTenantRequest {
  string confirm_name = 1;
}
message DeleteMyTenantResponse {}

// TenantService manages tenant metadata.
// CreateTenant is the bootstrap operation for a fresh self-hosted install.
// ----- licence register ----------------------------------------------------

// What the licensee actually holds. Which returns exist is a function of
// which licences are held; so is where the duty point falls, and so is
// what renewal reminders are possible at all.
enum ExciseLicenceKind {
  EXCISE_LICENCE_KIND_UNSPECIFIED = 0;
  EXCISE_LICENCE_KIND_SPIRITS = 1;           // L63A — produce or package spirits
  EXCISE_LICENCE_KIND_EXCISE_WAREHOUSE = 2;  // L63W — store non-duty-paid spirits
  EXCISE_LICENCE_KIND_USERS = 3;             // use spirits in manufacture
  EXCISE_LICENCE_KIND_WINE = 4;
  EXCISE_LICENCE_KIND_OTHER = 5;
}

// Whether a packaged lot must be released before it can be removed.
// Off by default: turning it on is a decision about how a distillery
// works, and defaulting it on would block every existing tenant's next
// removal on a workflow nobody asked for. A *hold* is honoured either
// way — holding a lot is an explicit act by a named person, and
// respecting it only when a flag happens to be on would make the act
// meaningless.
message SetBatchReleaseRequiredRequest { bool required = 1; }
message SetBatchReleaseRequiredResponse { bool required = 1; }

message ExciseLicence {
  string id = 1;
  ExciseLicenceKind kind = 2;
  string licence_number = 3;
  string effective_from = 4;  // ISO date
  // ISO date, or empty when nobody has recorded it. Empty raises no
  // renewal reminder: every CRA licence expires, so a missing date means
  // it is unknown, and a reminder for a guessed day gets believed.
  string expires_on = 5;
  string premises = 6;
  // Security posted under s.23. A decimal string, because it is money.
  string security_amount_cad = 7;
  string security_expires_on = 8;
  string notes = 9;
  // Surrendered or revoked. The row is kept, not deleted: a return filed
  // under a licence that no longer exists still has to be explicable.
  string ceased_on = 10;
}

message ListExciseLicencesRequest {}
message ListExciseLicencesResponse {
  repeated ExciseLicence licences = 1;
  // Live licences with no expiry recorded, so the screen can say the
  // register is incomplete rather than looking finished.
  int32 missing_expiry_count = 2;
}

message SaveExciseLicenceRequest {
  // Empty id creates; otherwise updates that licence.
  string id = 1;
  ExciseLicenceKind kind = 2;
  string licence_number = 3;
  string effective_from = 4;
  string expires_on = 5;
  string premises = 6;
  string security_amount_cad = 7;
  string security_expires_on = 8;
  string notes = 9;
  string ceased_on = 10;
}
message SaveExciseLicenceResponse { ExciseLicence licence = 1; }

// What the licensee would owe if everything crystallised now, set beside
// the security actually posted.
//
// Stillhouse does not decide what security is *required*. That is CRA's
// determination under s.23 and turns on things outside this system —
// which is why the response says so rather than printing a verdict. What
// it can do is compute the exposure, which is otherwise a figure nobody
// has.
message SecuritySufficiency {
  string licence_id = 1;
  string licence_number = 2;
  // Posted under s.23. Absent when the register has no figure, which is
  // different from a security of nothing.
  string security_amount_cad = 3;
  bool   security_amount_set = 4;
  string security_expires_on = 5;

  // Duty on returns already submitted. Whether it has actually been
  // remitted is not something Stillhouse can know, so it is reported and
  // labelled rather than assumed paid.
  double filed_duty_cad = 6;
  // Duty crystallised in periods with no submitted return.
  double unfiled_duty_cad = 7;
  // Not yet crystallised: packaged stock still held that was not dutied
  // at packaging, so duty falls when it leaves.
  double contingent_laa = 8;
  double contingent_duty_cad = 9;
  // Whether the contingent figure could be priced at all. False when the
  // rate for today cannot be sourced, in which case it is zero and the
  // note says why rather than the total quietly being short.
  bool   contingent_priced = 10;

  double total_exposure_cad = 11;
  // Posted security less the exposure. Negative means the exposure is
  // larger; it is not a statement that the security is insufficient,
  // which only CRA can make.
  double headroom_cad = 12;
  bool   headroom_known = 13;

  // What this figure is and is not. Never empty.
  string basis = 14;
  repeated string caveats = 15;
}

message SecuritySufficiencyRequest {}
message SecuritySufficiencyResponse {
  repeated SecuritySufficiency licences = 1;
}

service TenantService {
  rpc SecuritySufficiency(SecuritySufficiencyRequest) returns (SecuritySufficiencyResponse);
  rpc SetBatchReleaseRequired(SetBatchReleaseRequiredRequest) returns (SetBatchReleaseRequiredResponse);
  rpc ListExciseLicences(ListExciseLicencesRequest) returns (ListExciseLicencesResponse);
  rpc SaveExciseLicence(SaveExciseLicenceRequest) returns (SaveExciseLicenceResponse);
  rpc UpdateFilingCalendar(UpdateFilingCalendarRequest) returns (UpdateFilingCalendarResponse);
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  rpc DeleteMyTenant(DeleteMyTenantRequest) returns (DeleteMyTenantResponse);

  // Figures across every licence the caller holds an account at. Never a
  // combined return — see GroupEntity.
  rpc GroupView(GroupViewRequest) returns (GroupViewResponse);
  // Copy materials or suppliers from another distillery you hold an
  // account at. Copies, never shares — see CopyableReference.
  rpc CopyReferenceData(CopyReferenceDataRequest) returns (CopyReferenceDataResponse);
}

// A group view: figures across every licence the caller holds an account
// at. PLAN H7.
//
// The constraint that shapes this: a B266 is filed PER LICENCE. Two
// distilleries under one owner file two returns, and a figure spanning
// both is not a line on either. So there is no combined return here and
// there never will be — the view is per-licence rows, side by side, each
// carrying its own licence number, and any total is labelled as spanning
// separate returns rather than being one.
//
// The second constraint is quieter and matters as much: what a person may
// see at each licence is what their account THERE may see. Holding an
// owner's account at one distillery does not make somebody an owner at
// another, and a group view that pooled the reads would be a way to read
// past a role.
message GroupEntity {
  string tenant_id = 1;
  string tenant_name = 2;
  // The licence this entity files under. On every row, because it is what
  // makes the rows separate returns rather than departments.
  string cra_spirits_licence_number = 3;
  // The caller's role at THIS entity. Reads are performed as that role.
  string your_role = 4;

  double bulk_laa = 5;
  int32  packaged_bottles = 6;
  int32  cask_count = 7;

  // Where this licence stands with its own return.
  string next_period_start = 8;
  string next_period_end = 9;
  string next_due_on = 10;
  int32  days_until_due = 11;
  bool   period_generated = 12;
  bool   period_submitted = 13;
  // Set when this entity's figures could not be read — usually because
  // the caller's account there was removed between listing and reading.
  string unavailable = 14;
}

message GroupViewRequest {}
message GroupViewResponse {
  repeated GroupEntity entities = 1;
  // Sums across the rows above, for operational planning only. Labelled
  // rather than presented bare, because the whole risk of this screen is
  // somebody reading one of these onto a return.
  double total_bulk_laa = 2;
  int32  total_packaged_bottles = 3;
  // Said on the response, not in the documentation.
  string caution = 4;
  // How many of the licences above have a return due within the week and
  // nothing submitted. The one thing a group owner actually needs from a
  // combined screen.
  int32 returns_due_soon = 5;
}

// Carrying reference data between distilleries the caller holds accounts
// at. PLAN H7.
//
// This COPIES rather than shares, and the distinction is the design
// rather than an implementation shortcut.
//
// Shared mutable reference data across licences would mean one
// licensee's edit changing another's records — and a material's extract
// fraction feeds a conversion efficiency, which feeds a yield, which is
// the kind of figure that ends up defended to CRA. Two licences are two
// filers; each has to own the definitions its own numbers were computed
// from, including the right to have them be different.
//
// So the copy is a starting point that then diverges, which is what an
// operator setting up a second distillery actually wants: the grain list
// they already typed once, not a live link to somebody else's.
enum CopyableReference {
  COPYABLE_REFERENCE_UNSPECIFIED = 0;
  COPYABLE_REFERENCE_MATERIALS = 1;
  COPYABLE_REFERENCE_SUPPLIERS = 2;
}

message CopyReferenceDataRequest {
  // The distillery to copy FROM. The caller must hold an account there
  // too; this is not a way to read a licence you cannot already open.
  string from_tenant_id = 1;
  repeated CopyableReference what = 2;
}
message CopyReferenceDataResponse {
  int32 materials_copied = 1;
  int32 suppliers_copied = 2;
  // Names already present here and therefore left alone. Reported rather
  // than silently skipped or overwritten: an overwrite would replace a
  // definition this licensee's own figures were computed from.
  repeated string skipped = 3;
  string note = 4;
}
