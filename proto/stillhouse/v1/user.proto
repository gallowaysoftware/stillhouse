syntax = "proto3";

package stillhouse.v1;

import "google/protobuf/timestamp.proto";
import "stillhouse/v1/tenant.proto";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_OWNER = 1;
  USER_ROLE_OPERATOR = 2;
  USER_ROLE_VIEWER = 3;
  // The outside bookkeeper or excise consultant. Deliberately not on the
  // owner > operator > viewer line: more than a viewer on the compliance
  // surface — generate, submit and reopen a return, set the reporting
  // calendar, rule on a loss's duty treatment — and less than an
  // operator everywhere else. It can record no gauge, no bottling and no
  // removal, because someone who both books a movement and rules on its
  // treatment is the segregation-of-duties problem the audit trail
  // exists to make visible.
  USER_ROLE_ACCOUNTANT = 4;
}

message User {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string display_name = 4;
  UserRole role = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  Tenant tenant = 2;
}

message CreateUserRequest {
  string email = 1;
  string display_name = 2;
  UserRole role = 3;
}
message CreateUserResponse {
  User user = 1;
  // Plaintext initial password generated by the server. Surface this to the
  // operator once and instruct them to deliver it through a secure channel —
  // we do not store the plaintext anywhere.
  string initial_password = 2;
}

message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }

message ChangeMyPasswordRequest {
  string current_password = 1;
  string new_password = 2;
}
message ChangeMyPasswordResponse {}

service UserService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ChangeMyPassword(ChangeMyPasswordRequest) returns (ChangeMyPasswordResponse);
}
